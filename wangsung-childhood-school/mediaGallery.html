<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>왕성교회 주일학교 유년부 어린이 부흥회 날짜별 미디어 갤러리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 가로 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 팝업 미디어 영역: 화면 70% 크기 제한 및 정중앙 정렬 */
    .modal-media-wrapper {
      max-width: 70vw;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .modal-media-item {
      max-width: 70vw;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* 크게 보기 모드: 팝업을 화면 전체로 확장 (상단 헤더/하단 바 높이만큼 제외) */
    #mediaModal.is-large .modal-outer {
      padding: 0;
    }
    #mediaModal.is-large .modal-panel {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      max-height: none;
      border-radius: 0;
      border: 0;
    }
    #mediaModal.is-large .modal-media-area {
      flex: 1;
      min-height: 0;
      padding: 0;
    }
    #mediaModal.is-large .modal-media-wrapper,
    #mediaModal.is-large .modal-media-item {
      max-width: 100vw;
      max-height: calc(100vh - 120px);
      max-height: calc(100dvh - 120px);
    }
    #mediaModal.is-large .modal-media-item {
      border-radius: 0;
    }

    /* 50x50 썸네일 규격 고정 */
    .thumb-btn {
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      max-width: 50px;
      max-height: 50px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ================================================================= -->
  <!-- 1. 상단 헤더 & 날짜 탭 영역 (스크립트에서 탭 자동 렌더링) -->
  <!-- ================================================================= -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="p-1.5 bg-indigo-600/20 text-indigo-400 rounded-lg border border-indigo-500/30">
          <i data-lucide="clapperboard" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            왕성교회 주일학교 유년부 어린이 부흥회 날짜별 미디어 갤러리
          </h1>
        </div>
      </div>
    </div>

    <!-- 날짜 탭 리스트 (JavaScript로 렌더링) -->
    <nav class="border-t border-slate-800 bg-slate-900/60">
      <div class="max-w-7xl mx-auto px-4">
        <div id="tabList" class="flex space-x-2 overflow-x-auto py-2.5 px-1.5 -mx-1.5 no-scrollbar">
          <!-- 10월 1일 ~ 10월 4일 탭 버튼이 스크립트에 의해 자동 삽입됩니다 -->
        </div>
      </div>
    </nav>
  </header>

  <!-- ================================================================= -->
  <!-- 2. 메인 콘텐츠: 50x50 썸네일 그리드 영역 -->
  <!-- ================================================================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
      <div>
        <h2 id="currentDateTitle" class="text-lg md:text-xl font-bold text-white flex items-center gap-2">
          -
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">
          썸네일(50×50)을 클릭하면 화면 70% 사이즈의 중앙 레이어 팝업으로 열립니다.
        </p>
      </div>
      <div class="flex items-center gap-4 text-xs text-slate-300 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 self-start sm:self-auto">
        <!-- 썸네일 우측 하단 배지와 동일한 아이콘 -->
        <span class="inline-flex items-center gap-1.5"><span class="inline-flex p-0.5 bg-black/80 rounded"><svg class="w-3 h-3 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></span>사진</span>
        <span class="inline-flex items-center gap-1.5"><span class="inline-flex p-0.5 bg-black/80 rounded"><svg class="w-3 h-3 text-indigo-400 fill-indigo-400" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></span>재생 가능 영상</span>
      </div>
    </div>

    <!-- 썸네일 목록 컨테이너 -->
    <div class="p-4 sm:p-5 bg-slate-900/40 rounded-2xl border border-slate-800/80 min-h-[300px]">
      <div id="mediaGrid" class="flex flex-wrap gap-2.5">
        <!-- 스크립트 데이터 배열로부터 30개의 50x50 버튼이 렌더링됩니다 -->
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    반응형 미디어 플레이어 &bull; 뷰포트 70% 중앙 레이어 팝업 &bull; ESC 키로 닫기 지원
  </footer>

  <!-- ================================================================= -->
  <!-- 3. 레이어 팝업 (화면 70% 이내 정중앙 모달) -->
  <!-- ================================================================= -->
  <div id="mediaModal" class="fixed inset-0 z-50 hidden transition-opacity" role="dialog" aria-modal="true">
    
    <!-- 어두운 배경 (클릭 시 팝업 닫힘) -->
    <div id="modalBackdrop" class="fixed inset-0 bg-black/85 backdrop-blur-sm" onclick="closeMediaModal()"></div>

    <!-- 팝업 본체 -->
    <div class="modal-outer fixed inset-0 z-10 flex items-center justify-center p-3 sm:p-6 pointer-events-none">
      <div class="modal-panel pointer-events-auto relative bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl flex flex-col items-center overflow-hidden max-w-[95vw] max-h-[95vh]">
        
        <!-- 상단 헤더 바 (미디어 제목 및 X 닫기 버튼) -->
        <div class="w-full flex items-center justify-between px-4 py-2.5 bg-slate-950/90 border-b border-slate-800">
          <div class="flex items-center space-x-2 truncate pr-4">
            <span id="modalTypeBadge" class="text-[11px] px-2 py-0.5 rounded font-medium"></span>
            <span id="modalItemTitle" class="text-xs sm:text-sm font-semibold text-slate-200 truncate"></span>
          </div>
          
          <!-- 상단 우측 X 닫기 버튼 -->
          <button type="button" aria-label="팝업 닫기" onclick="closeMediaModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 active:scale-95 transition-all focus:outline-none">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- 미디어 표시 영역 (화면 70% 제한 및 중앙 정렬) -->
        <div class="modal-media-area relative p-2 sm:p-4 flex items-center justify-center bg-black/75 overflow-hidden w-full">
          <!-- 이전 버튼 (첫 번째 항목에서는 숨김) -->
          <button id="prevBtn" type="button" aria-label="이전 미디어" onclick="showPrevMedia()" class="absolute left-2 sm:left-3 top-1/2 -translate-y-1/2 z-10 p-2 rounded-full bg-black/60 text-white border border-slate-600/60 hover:bg-indigo-600 active:scale-95 transition-all focus:outline-none">
            <i data-lucide="chevron-left" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </button>

          <!-- 다음 버튼 (마지막 항목에서는 숨김) -->
          <button id="nextBtn" type="button" aria-label="다음 미디어" onclick="showNextMedia()" class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 z-10 p-2 rounded-full bg-black/60 text-white border border-slate-600/60 hover:bg-indigo-600 active:scale-95 transition-all focus:outline-none">
            <i data-lucide="chevron-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </button>

          <div class="modal-media-wrapper">
            <!-- 사진 이미지 엘리먼트 -->
            <img id="modalImage" class="modal-media-item rounded-lg shadow-md hidden" alt="상세 이미지" />
            
            <!-- 비디오 엘리먼트 (재생 가능한 MP4) -->
            <video id="modalVideo" class="modal-media-item rounded-lg shadow-md hidden bg-black" playsinline controls controlsList="nodownload">
              브라우저가 HTML5 비디오를 지원하지 않습니다.
            </video>
          </div>
        </div>

        <!-- 하단 바 (영상 컨트롤 + 크게 보기 버튼, 사진/영상 공통 노출) -->
        <div class="w-full px-4 py-3 bg-slate-950/95 border-t border-slate-800 flex flex-wrap items-center justify-center gap-3">
        <!-- 영상 컨트롤 (Play / Stop 버튼, 영상일 때만 노출) -->
        <div id="videoControls" class="flex items-center justify-center gap-3">
          <!-- 재생 (Play) 버튼 -->
          <button id="playBtn" type="button" onclick="playModalVideo()" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-md shadow-indigo-600/30 active:scale-95 transition-all">
            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
            <span>재생 (Play)</span>
          </button>
          
          <!-- 정지 (Stop) 버튼 -->
          <button id="stopBtn" type="button" onclick="stopModalVideo()" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-md shadow-rose-600/30 active:scale-95 transition-all">
            <i data-lucide="square" class="w-4 h-4 fill-current"></i>
            <span>정지 (Stop)</span>
          </button>

          <!-- 재생 상태 텍스트 -->
          <div class="hidden sm:flex items-center gap-1.5 text-xs text-slate-400 border-l border-slate-800 pl-3">
            <span id="videoStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
            <span id="videoStatusText">정지됨</span>
          </div>
        </div>

          <!-- 크게 보기 / 원래 크기 토글 버튼 -->
          <button id="zoomBtn" type="button" onclick="toggleLargeView()" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-md active:scale-95 transition-all">
            <svg id="zoomIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            <span id="zoomText">크게 보기</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ================================================================= -->

        { type: 'video', thumb: '1023/thumbs/IMG_5067.jpg', src: '1023/IMG_5067.mp4', title: '10월 23일 - 영상 44' },
        { type: 'image', thumb: '1023/IMG_5068.jpg', src: '1023/IMG_5068.jpg', title: '10월 23일 - 사진 45' },
        { type: 'image', thumb: '1023/IMG_5069.jpg', src: '1023/IMG_5069.jpg', title: '10월 23일 - 사진 46' },
        { type: 'video', thumb: '1023/thumbs/IMG_5070.jpg', src: '1023/IMG_5070.mp4', title: '10월 23일 - 영상 47' },
        { type: 'video', thumb: '1023/thumbs/IMG_5071.jpg', src: '1023/IMG_5071.mp4', title: '10월 23일 - 영상 48' },
        { type: 'image', thumb: '1023/IMG_5072.jpg', src: '1023/IMG_5072.jpg', title: '10월 23일 - 사진 49' },
        { type: 'image', thumb: '1023/IMG_5073.jpg', src: '1023/IMG_5073.jpg', title: '10월 23일 - 사진 50' }
      ]
    };

    // 현재 선택된 날짜 (기본값: 최신 날짜 '10월 23일')
    let currentDateKey = '10월 23일';

    // DOM 요소 캐싱
    const tabListEl = document.getElementById('tabList');
    const mediaGridEl = document.getElementById('mediaGrid');
    const currentDateTitleEl = document.getElementById('currentDateTitle');
    
    // 모달 DOM 참조
    const mediaModal = document.getElementById('mediaModal');
    const modalImage = document.getElementById('modalImage');
    const modalVideo = document.getElementById('modalVideo');
    const videoControls = document.getElementById('videoControls');
    const modalItemTitle = document.getElementById('modalItemTitle');
    const modalTypeBadge = document.getElementById('modalTypeBadge');
    const videoStatusDot = document.getElementById('videoStatusDot');
    const videoStatusText = document.getElementById('videoStatusText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const zoomText = document.getElementById('zoomText');
    const zoomIcon = document.getElementById('zoomIcon');

    // 크게 보기 아이콘 (확대 / 축소)
    const ZOOM_IN_ICON = '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>';
    const ZOOM_OUT_ICON = '<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>';

    // 팝업에 현재 표시 중인 항목의 인덱스
    let currentMediaIndex = 0;

    /**
     * 상단 탭 렌더링
     */
    function renderTabs() {
      const dates = Object.keys(mediaData);
      tabListEl.innerHTML = '';

      dates.forEach(date => {
        const isActive = (date === currentDateKey);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `tab-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold whitespace-nowrap transition-all duration-150 flex-shrink-0 cursor-pointer ${
          isActive 
            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30 ring-1 ring-indigo-400' 
            : 'bg-slate-800/80 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
        }`;
        
        button.textContent = (date === '10월 4일') ? `${date} (최근)` : date;
        button.onclick = () => selectDate(date);
        tabListEl.appendChild(button);
      });
    }

    /**
     * 날짜 선택 시 호출되는 함수
     */
    function selectDate(date) {
      currentDateKey = date;
      renderTabs();
      renderThumbnails(date);
    }

    /**
     * 선택된 날짜의 썸네일 그리드 렌더링 (50x50 크기 고정)
     */
    function renderThumbnails(date) {
      currentDateTitleEl.textContent = `${date} 미디어 목록 (${mediaData[date].length}개)`;
      mediaGridEl.innerHTML = '';

      const items = mediaData[date] || [];

      items.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'thumb-btn relative rounded-lg overflow-hidden bg-slate-800 border border-slate-700 hover:scale-110 hover:border-indigo-400 transition-transform focus:outline-none';
        btn.title = item.title;

        // 50x50 썸네일 이미지
        const img = document.createElement('img');
        img.src = item.thumb;
        img.alt = item.title;
        img.className = 'w-full h-full object-cover';
        img.loading = 'lazy';
        btn.appendChild(img);

        // 우측 하단 배지 표시 (영상: 재생 아이콘, 사진: 연두색 사진 아이콘)
        const badge = document.createElement('span');
        badge.className = 'absolute bottom-0 right-0 p-0.5 bg-black/80 rounded-tl';
        if (item.type === 'video') {
          badge.innerHTML = `<svg class="w-2.5 h-2.5 text-indigo-400 fill-indigo-400" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
        } else {
          badge.innerHTML = `<svg class="w-2.5 h-2.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>`;
        }
        btn.appendChild(badge);

        // 클릭 이벤트 연결 -> 레이어 팝업 열기
        btn.onclick = () => openMediaModal(index);
        mediaGridEl.appendChild(btn);
      });
    }

    /**
     * 레이어 팝업 열기 (화면 70% 제한 중앙 정렬)
     */
    function openMediaModal(index) {
      const items = mediaData[currentDateKey] || [];
      const item = items[index];
      if (!item) return;
      currentMediaIndex = index;

      // 맨 처음/맨 마지막 항목에서는 이전/다음 버튼 숨김
      prevBtn.classList.toggle('hidden', index === 0);
      nextBtn.classList.toggle('hidden', index === items.length - 1);

      modalItemTitle.textContent = `${item.title} (${index + 1} / ${items.length})`;

      if (item.type === 'video') {
        modalTypeBadge.textContent = '영상 (Video)';
        modalTypeBadge.className = 'text-[11px] px-2 py-0.5 rounded font-medium bg-indigo-600/30 text-indigo-300 border border-indigo-500/30';

        // 이미지 숨기기
        modalImage.classList.add('hidden');
        modalImage.src = '';

        // 비디오 표시 및 소스 지정
        modalVideo.classList.remove('hidden');
        modalVideo.src = item.src;
        videoControls.classList.remove('hidden');

        setVideoStatus('정지됨', false);
        modalVideo.load();
      } else {
        modalTypeBadge.textContent = '사진 (Image)';
        modalTypeBadge.className = 'text-[11px] px-2 py-0.5 rounded font-medium bg-emerald-600/30 text-emerald-300 border border-emerald-500/30';

        // 비디오 정지 및 숨기기
        modalVideo.pause();
        modalVideo.currentTime = 0;
        modalVideo.src = '';
        modalVideo.classList.add('hidden');
        videoControls.classList.add('hidden');

        // 이미지 표시 및 소스 지정
        modalImage.classList.remove('hidden');
        modalImage.src = item.src;
      }

      mediaModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // 배경 스크롤 방지

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    /**
     * 이전/다음 미디어로 이동 (팝업 내 화살표 버튼 및 키보드 ←/→)
     */
    function showPrevMedia() {
      if (currentMediaIndex > 0) {
        modalVideo.pause();
        openMediaModal(currentMediaIndex - 1);
      }
    }

    function showNextMedia() {
      const items = mediaData[currentDateKey] || [];
      if (currentMediaIndex < items.length - 1) {
        modalVideo.pause();
        openMediaModal(currentMediaIndex + 1);
      }
    }

    /**
     * 크게 보기 모드 토글 (하단 '크게 보기' 버튼)
     */
    function setLargeView(isLarge) {
      mediaModal.classList.toggle('is-large', isLarge);
      zoomText.textContent = isLarge ? '원래 크기' : '크게 보기';
      zoomIcon.innerHTML = isLarge ? ZOOM_OUT_ICON : ZOOM_IN_ICON;
    }

    function toggleLargeView() {
      setLargeView(!mediaModal.classList.contains('is-large'));
    }

    /**
     * 레이어 팝업 닫기 (X 버튼 및 배경 클릭 시)
     */
    function closeMediaModal() {
      setLargeView(false);
      if (!modalVideo.paused) {
        modalVideo.pause();
      }
      modalVideo.currentTime = 0;
      modalVideo.src = '';
      modalImage.src = '';

      mediaModal.classList.add('hidden');
      document.body.style.overflow = '';
      setVideoStatus('정지됨', false);
    }

    /**
     * 영상 재생 (Play 버튼)
     */
    function playModalVideo() {
      if (modalVideo.src) {
        const promise = modalVideo.play();
        if (promise !== undefined) {
          promise.catch(() => {
            // 브라우저 자동재생 보안 정책 시 음소거 후 재생 시도
            modalVideo.muted = true;
            modalVideo.play();
          });
        }
      }
    }

    /**
     * 영상 정지 및 되감기 (Stop 버튼)
     */
    function stopModalVideo() {
      modalVideo.pause();
      modalVideo.currentTime = 0;
      setVideoStatus('정지됨 (0:00)', false);
    }

    /**
     * 영상 상태 텍스트 & 인디케이터 업데이트
     */
    function setVideoStatus(text, isPlaying) {
      if (!videoStatusText || !videoStatusDot) return;
      videoStatusText.textContent = text;
      if (isPlaying) {
        videoStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        videoStatusText.className = 'text-emerald-400 font-medium';
      } else {
        videoStatusDot.className = 'w-2 h-2 rounded-full bg-slate-500';
        videoStatusText.className = 'text-slate-400';
      }
    }

    // 비디오 이벤트 리스너
    modalVideo.addEventListener('play', () => setVideoStatus('재생 중...', true));
    modalVideo.addEventListener('pause', () => setVideoStatus('일시정지됨', false));
    modalVideo.addEventListener('ended', () => setVideoStatus('재생 완료됨', false));

    // 키보드 ESC로 팝업 닫기, ←/→로 이전/다음 이동
    window.addEventListener('keydown', (e) => {
      if (mediaModal.classList.contains('hidden')) return;
      if (e.key === 'Escape') {
        closeMediaModal();
      } else if (e.key === 'ArrowLeft') {
        showPrevMedia();
      } else if (e.key === 'ArrowRight') {
        showNextMedia();
      }
    });

    // 초기화: 탭 및 최근 날짜(10월 4일) 기본 렌더링
    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderThumbnails(currentDateKey);
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
