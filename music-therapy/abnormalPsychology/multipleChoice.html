<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이상심리학 전범위 정밀 객관식 모의고사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .card { width: 100%; max-width: 760px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; height: fit-content; margin-bottom: 25px; }
    header { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; padding: 22px 18px; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-sub { font-size: 11px; background: rgba(99,102,241,0.25); border: 1px solid rgba(165,180,252,0.4); color: #c7d2fe; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .badge-rnd { font-size: 11px; background: rgba(251,191,36,0.2); border: 1px solid rgba(251,191,36,0.5); color: #fde68a; padding: 3px 8px; border-radius: 999px; font-weight: 800; }
    h1 { font-size: 19px; font-weight: 900; }
    .pbar-bg { width: 100%; height: 7px; background: #1e293b; border-radius: 999px; margin-top: 14px; overflow: hidden; }
    .pbar-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #34d399); width: 10%; transition: width 0.3s; }
    .prow { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-top: 6px; font-weight: 600; }
    section { padding: 20px 18px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
    .qtitle { font-size: 13.5px; font-weight: 500; color: #0f172a; line-height: 1.7; margin-bottom: 18px; background: #f8fafc; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0; white-space: pre-line; }
    .qtitle strong { color: #4338ca; font-weight: 800; }
    .opt-list { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn { width: 100%; text-align: left; padding: 13px 15px; font-size: 13.5px; font-weight: 600; border: 1.5px solid #cbd5e1; border-radius: 12px; background: #fff; cursor: pointer; transition: all 0.2s; line-height: 1.4; display: flex; justify-content: space-between; align-items: center; }
    .opt-btn:active { background: #f1f5f9; }
    .opt-correct { background: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: 800; }
    .opt-wrong { background: #fff1f2 !important; border-color: #f43f5e !important; color: #9f1239 !important; font-weight: 800; }
    .opt-dim { opacity: 0.35; }
    .fb { margin-top: 18px; border-radius: 14px; padding: 16px; display: none; line-height: 1.6; font-size: 12.5px; }
    .fb-ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .fb-no { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; }
    .fbt { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .fbd { color: #334155; }
    .fbd strong { color: #1e1b4b; }
    .fbd-box { background: rgba(255,255,255,0.7); border-radius: 8px; padding: 10px; margin-top: 8px; border: 1px solid rgba(0,0,0,0.06); }
    .nbtn { width: 100%; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; padding: 13px; cursor: pointer; margin-top: 12px; }
    .rsec { display: none; text-align: center; padding: 26px 18px; }
    .scbox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; margin: 18px 0; }
    .scnum { font-size: 34px; font-weight: 900; color: #4f46e5; margin: 6px 0; }
    .wlist { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; max-height: 280px; overflow-y: auto; font-size: 11.5px; margin-bottom: 16px; line-height: 1.6; }
    .witem { border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
    .witem:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="badge-row">
        <span class="badge-sub">이상심리학 석사과정 | 특징·원인·치료 전수 상세</span>
        <span id="rb" class="badge-rnd">제 1 회차 / 총 10회차</span>
      </div>
      <h1>이상심리학 정밀 4지선다 모의고사</h1>
      <div class="pbar-bg"><div id="pf" class="pbar-fill"></div></div>
      <div class="prow"><span id="pqt">문제 1 / 10</span><span id="rst">점수: 0 / 10</span></div>
    </header>

    <section id="qsec">
      <span id="cb" class="tag">단원명</span>
      <div id="qt" class="qtitle">문제를 불러오는 중...</div>
      <div id="opts" class="opt-list"></div>
      <div id="fbc" class="fb">
        <div id="ft" class="fbt"></div>
        <div id="fd" class="fbd"></div>
        <button type="button" id="nb" class="nbtn" onclick="nxt()">다음 문제 ➔</button>
      </div>
    </section>

    <section id="rsec" class="rsec">
      <h2 style="font-size: 20px; font-weight: 800;">🎯 회차 모의고사 완료!</h2>
      <div class="scbox">
        <div style="font-size: 12px; color: #64748b; font-weight: 600;">이번 회차 점수</div>
        <div id="fsc" class="scnum">0 / 10</div>
        <div id="cum" style="font-size: 11.5px; color: #059669; font-weight: 700;">누적 정답률: 0%</div>
      </div>
      <div id="wl" class="wlist"></div>
      <button type="button" id="nrb" class="nbtn" onclick="nr()">다음 랜덤 10문제 생성 ➔</button>
    </section>
  </div>

  <script>
    var POOL = [
      // ==================== 제5장 불안장애: 범불안장애 (슬라이드 2~5쪽 100% 반영) ====================
      {
        c: "제5장 불안장애",
        q: "다음은 DSM-5 진단기준, 임상적 특징 및 병인론에 대한 강의안 내용이다. 해당하는 장애는?\n\n" +
           "• <strong>DSM-5 진단기준:</strong> 일상 활동에서 과도한 불안이나 걱정을 적어도 6개월 이상 겪으며 조절이 곤란함. 다음 6가지 증상(①안절부절못함/가장자리에 선 느낌, ②쉽게 피로해짐, ③집중 곤란/머릿속이 하얘짐, ④과민성, ⑤근육 긴장, ⑥수면 장애) 중 3가지 이상 동반 (단, 아동은 1가지만 필요).\n" +
           "• <strong>임상적 특징:</strong> 걱정이 전반적이고 극심하며 유발요인 없이도 발생하고 여성이 남성보다 높음. 청소년기는 학교 수행에 관한 걱정이 많고 노년층은 가족의 안녕과 신체 건강에 대한 걱정이 대부분임.\n" +
           "• <strong>생물학/기질:</strong> 신경전달물질 GABA 수용기가 너무 작거나 결합이 지연됨; 전전두엽-전대상회-편도체 회로 기능 저하; 행동억제 및 신경증적 회피 기질.\n" +
           "• <strong>심리학적 이론:</strong> 원초아 충동 표현이 금지/처벌될 때 생기는 신경증적·도덕적 불안 및 부모의 과잉보호; '상황이나 사람은 안전하다고 증명될 때까지는 안전하지 않다'는 비합리적 가정과 <strong>초걱정(meta-worry)</strong>; 발생 가능성이 낮아도 확실성을 찾지 못해 불안한 <strong>불확실성을 견딜 수 없다는 이론(IU)</strong>; 신체적 불쾌감과 각성(심박수, 땀, 호흡)을 피하기 위해 걱정으로 도망치는 <strong>회피 이론</strong>.",
        o: ["범불안장애 (GAD)", "공황장애 (Panic Disorder)", "적응장애 (Adjustment Disorder)", "강박장애 (OCD)"],
        a: 0,
        ex: "슬라이드 2~5쪽에 제시된 범불안장애(GAD)의 전체 내용입니다. 진단기준(6개월 이상, 6개 중 성인 3개/아동 1개 이상 신체증상), 청소년(학교수행) vs 노년층(가족안녕/건강)의 걱정 주제, GABA 결함, 초걱정(meta-worry), 불확실성 불내성(IU), 신체 불쾌감을 피하기 위한 회피 이론이 모두 일치합니다."
      },

      // ==================== 제5장 불안장애: 공황장애 ====================
      {
        c: "제5장 불안장애",
        q: "다음 임상적 특징, 신경생물학적 원인 및 근거기반 치료 기법에 해당하는 장애는?\n\n" +
           "• <strong>임상적 특징:</strong> 특별한 유발 자극 없이 갑작스럽게 심계항진, 질식할 듯한 느낌, 어지러움, 죽을 것 같은 공포나 미쳐버릴 것 같은 두려움이 몇 분 이내에 최고조에 달하는 발작이 반복됨. 발작 발생 후 추가 발작에 대한 지속적인 걱정(예기불안)이나 부적응적 행동 변화가 최소 1개월 이상 지속됨.\n" +
           "• <strong>생물학/원인:</strong> 청반(Locus coeruleus) 중심의 노르에피네프린 신경전달물질 활동이 불규칙적임; 경미한 신체 감각(가슴 두근거림 등)을 심장마비나 재앙의 신호로 파국적 오해석하는 높은 '불안민감도(Anxiety Sensitivity)'.\n" +
           "• <strong>치료:</strong> 의도적으로 회전의자 돌기, 빨대 호흡, 과호흡 등을 실시하여 두려워하는 신체감각에 직면·습관화시키는 <strong>내부감각수용 노출(Interoceptive Exposure)</strong> 및 공황통제치료(PCT).",
        o: ["공황장애 (Panic Disorder)", "광장공포증 (Agoraphobia)", "질병불안장애", "특정공포증"],
        a: 0,
        ex: "예기치 못한 공황발작과 1개월 이상의 예기불안, 노르에피네프린 이상, 신체감각의 파국적 오해석(불안민감도), 내부감각수용 노출치료가 특징인 공황장애입니다."
      },

      // ==================== 제5장 불안장애: 광장공포증 ====================
      {
        c: "제5장 불안장애",
        q: "다음 진단기준 및 임상 양상에 해당하는 불안장애는?\n\n" +
           "• <strong>DSM-5 진단기준:</strong> ①대중교통수단 이용, ②열려 있는 공간, ③밀폐된 공간, ④줄 서기 또는 군중 속에 있기, ⑤집 밖에 혼자 있기라는 5가지 상황 중 <strong>2가지 이상의 상황</strong>에서 현저한 극도의 공포와 불안을 느낌.\n" +
           "• <strong>임상적 특징:</strong> 공황 증상이나 무력하고 당황스러운 증상이 나타났을 때 즉각 탈출하기 어렵거나 도움을 받기 어려울 것이라는 생각 때문에 해당 상황을 적극적으로 회피하거나 동반자를 요구하며, 공포와 회피가 통상적으로 6개월 이상 지속됨.",
        o: ["광장공포증 (Agoraphobia)", "사회공포증 (사회불안장애)", "특정공포증 상황형", "분리불안장애"],
        a: 0,
        ex: "광장공포증(Agoraphobia)은 5가지 전형적 장소 중 2가지 이상에서 탈출 곤란 및 도움 부재에 대한 공포로 회피가 6개월 이상 지속되는 장애입니다."
      },

      // ==================== 제6장 강박 및 관련 장애: 강박장애 ====================
      {
        c: "제6장 강박 및 관련 장애",
        q: "다음 임상적 특징, 인지/생물학적 원인 및 근거기반 치료 기법에 해당하는 장애는?\n\n" +
           "• <strong>임상적 특징:</strong> 침투적이고 원치 않는 방식으로 경험되는 오염에 대한 사고, 공격적/폭력적 이미지, 타인을 찌르는 충동 등의 강박사고와, 이를 중화하기 위해 엄격한 규칙대로 수행하는 손 씻기, 확인하기, 정돈하기 등의 강박행동이 하루 1시간 이상 소모됨.\n" +
           "• <strong>원인:</strong> 안와전두피질(OFC)과 미상핵(Caudate nucleus) 회로의 과활성화; 세로토닌 불균형; 생각을 통제하려 할수록 더 떠오르는 '북극곰 실험(아이러니 효과)'; 생각을 하는 것만으로도 행동을 저지른 것과 같다고 믿는 <strong>사고-행위 융합(Thought-Action Fusion)</strong> 인지 왜곡.\n" +
           "• <strong>치료:</strong> 오염 자극에 노출시킨 후 손 씻기 등의 의례 행동을 의도적으로 금지하여 불안을 자연 소거시키는 <strong>노출 및 반응 방지(ERP)</strong> 기법.",
        o: ["강박장애 (OCD)", "신체변형장애 (BDD)", "털뽑기장애", "범불안장애"],
        a: 0,
        ex: "하루 1시간 이상의 강박사고/행동, 안와전두피질-미상핵 이상, 사고-행위 융합(TAF), 노출 및 반응 방지(ERP)가 핵심인 강박장애(OCD)입니다."
      },

      // ==================== 제6장 강박 및 관련 장애: 신체변형장애 & 털뽑기장애 ====================
      {
        c: "제6장 강박 및 관련 장애",
        q: "다음 임상 양상 및 감별 기준에 해당하는 장애는?\n\n" +
           "• <strong>임상적 특징:</strong> 타인이 볼 때는 미미하거나 알아보기 어려운 하나 이상의 신체 외모 결함에 병적으로 집착하여 하루 수 시간을 거울 확인하기, 과도한 치장, 피부 뜯기, 타인과의 외모 비교 행동에 소모함.\n" +
           "• <strong>감별 진단:</strong> 다른 강박장애와 달리 병적 몰두와 의례 행동의 대상이 '오직 자신의 외모 결함'에만 국한된다는 점에서 구분되며, 세부 특징에 과도하게 초점을 맞추는 인지 편향이 관찰됨.",
        o: ["신체변형장애 (BDD, 신체이형장애)", "강박장애", "피부뜯기장애", "저장장애"],
        a: 0,
        ex: "신체변형장애(BDD)는 타인이 인지하지 못하는 외모 결함에 집착하여 거울 확인, 과도한 치장 등의 반복 행동을 보이는 장애입니다."
      },
      {
        c: "제6장 강박 및 관련 장애",
        q: "다음 임상적 특징 및 전문 행동치료 기법에 해당하는 장애는?\n\n" +
           "• <strong>임상적 특징:</strong> 자신의 신체 부위(두피, 눈썹 등)에 난 털을 반복적으로 뽑아 뚜렷한 탈모로 이어지며 멈추려는 시도에 번번이 실패함. 뽑은 털을 삼킬 경우 위장관 내 결석을 형성하는 이식증 및 장폐색 위험이 있음.\n" +
           "• <strong>치료 기법:</strong> 충동이 일어나는 순간을 자각하고, 털을 뽑는 행동과 양립할 수 없는 동작(주먹 쥐기, 손에 물건 쥐기 등)을 훈련하는 <strong>습관반전훈련(HRT)</strong> 및 수용증진행동치료(AEBT).",
        o: ["털뽑기장애 (발모광, Trichotillomania)", "피부뜯기장애", "상동증적 운동장애", "뚜렛장애"],
        a: 0,
        ex: "반복적인 털뽑기로 탈모를 유발하며, 경쟁 반응을 고안하는 습관반전훈련(HRT)이 대표 치료법인 털뽑기장애(발모광)입니다."
      },

      // ==================== 제4장 기분관련장애: 주요우울장애 & 지속성 우울장애 ====================
      {

        ex: "낯선 성인에 대한 조심성이 결여되어 무분별하게 다가가는 탈억제성 사회적 유대감 장애(DSED, 탈억제성 사회관여 장애)입니다."
      },

      // ==================== 제7장 8번 해리장애 (중간고사 최종) ====================
      {
        c: "제7장 8번 해리장애 (중간고사 범위 끝)",
        q: "다음 진단기준 및 정신역동적 원인론에 해당하는 질환은?\n\n" +
           "• <strong>진단기준:</strong> 2개 이상의 별개의 성격 상태로 특징되는 정체성의 붕괴를 보이며, 일상적 사건이나 중요한 개인 정보 또는 외상 사건을 기억할 때 일상적 망각으로는 설명되지 않는 반복적인 기억의 공백을 동반함 (구 다중인격장애).\n" +
           "• <strong>원인론:</strong> 아동기 극심한 신체적·성적 학대 외상으로부터 자아를 보호하기 위해 일생 동안 지속되는 <strong>극단적인 거대한 억압(massive repression)</strong> 기제 및 <strong>자기최면(self-hypnosis)</strong>으로 발전함.\n" +
           "• <strong>치료:</strong> 최면치료를 통해 분열된 하위 성격들을 의식화하고 하나의 온전한 자아로 통합하는 성격 통합(Integration) 치료.",
        o: ["해리성 정체감 장애 (DID)", "조현병", "해리성 기억상실증", "경계선 성격장애"],
        a: 0,
        ex: "2개 이상의 독립 성격과 기억 공백이 특징이며 아동기 학대에 대한 거대한 억압과 자기최면이 원인인 해리성 정체감 장애(DID, 구 다중인격장애)입니다."
      }
    ];

    var rnd = 1, cur = [], idx = 0, sc = 0, tot = 0, ans = false, wl = [];
    function shf(a) { var c=a.slice(); for(var i=c.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=c[i]; c[i]=c[j]; c[j]=t; } return c; }

    function ir(r) {
      rnd = r; idx = 0; sc = 0; ans = false; wl = [];
      var shuffledPool = shf(POOL);
      cur = shuffledPool.slice(0, 10).map(function(q) {
        var correctText = q.o[q.a];
        var shuffledOpts = shf(q.o);
        return {
          c: q.c, q: q.q, o: shuffledOpts, a: shuffledOpts.indexOf(correctText), ex: q.ex
        };
      });

      document.getElementById("rb").innerText = "제 " + rnd + " 회차 / 총 10회차";
      document.getElementById("qsec").style.display = "block";
      document.getElementById("rsec").style.display = "none";
      rq();
    }

    function rq() {
      ans = false; var q = cur[idx];
      document.getElementById("pqt").innerText = "문제 " + (idx+1) + " / 10";
      document.getElementById("rst").innerText = "점수: " + sc + " / 10";
      document.getElementById("pf").style.width = ((idx+1)*10) + "%";
      document.getElementById("cb").innerText = q.c;
      document.getElementById("qt").innerHTML = q.q;
      document.getElementById("fbc").style.display = "none";

      var optsContainer = document.getElementById("opts");
      optsContainer.innerHTML = "";

      q.o.forEach(function(optText, optIdx) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn";
        btn.innerHTML = "<span>" + (optIdx+1) + ". " + optText + "</span><span class='ind' style='font-size:11px; font-weight:800;'></span>";
        btn.onclick = function() { check(optIdx); };
        optsContainer.appendChild(btn);
      });
    }

    function check(selIdx) {
      if(ans) return;
      ans = true;
      var q = cur[idx];
      var isOk = (selIdx === q.a);
      if(isOk) { sc++; tot++; } else {
        wl.push({ q: q.q, u: q.o[selIdx], c: q.o[q.a], ex: q.ex });
      }

      var btns = document.getElementById("opts").querySelectorAll("button");
      btns.forEach(function(b, i) {
        b.disabled = true;
        var ind = b.querySelector(".ind");
        if(i === q.a) {
          b.className = "opt-btn opt-correct";
          ind.innerText = "✓ 정답";
        } else if(i === selIdx) {
          b.className = "opt-btn opt-wrong";
          ind.innerText = "✕ 오답";
        } else {
          b.className = "opt-btn opt-dim";
        }
      });

      var fbc = document.getElementById("fbc");
      var ft = document.getElementById("ft");
      var fd = document.getElementById("fd");
      fbc.style.display = "block";
      fbc.className = "fb " + (isOk ? "fb-ok" : "fb-no");
      ft.innerText = isOk ? "🎉 정답입니다!" : "💡 오답 (정답: " + q.o[q.a] + ")";
      fd.innerHTML = "<div class='fbd-box'><strong>💡 교재 상세 해설:</strong> " + q.ex + "</div>";
      document.getElementById("rst").innerText = "점수: " + sc + " / 10";
      document.getElementById("nb").innerText = (idx===9 ? "회차 성적 확인하기 📊" : "다음 문제 ➔");
    }

    function nxt() { if(idx<9){ idx++; rq(); } else { sr(); } }

    function sr() {
      document.getElementById("qsec").style.display = "none";
      document.getElementById("rsec").style.display = "block";
      document.getElementById("fsc").innerText = sc + " / 10";
      var rate = Math.round((tot / (rnd * 10)) * 100);
      document.getElementById("cum").innerText = "누적 정답률: " + rate + "% (" + tot + " / " + (rnd * 10) + ")";
      var w = document.getElementById("wl"); w.innerHTML = "";
      if(wl.length === 0){
        w.innerHTML = "<p style='color:#059669; font-weight:bold; text-align:center;'>✨ 대단합니다! 이번 회차 10문제를 모두 맞히셨습니다!</p>";
      } else {
        var h = "<p style='font-weight:bold; color:#e11d48; margin-bottom:8px;'>⚠️ 이번 회차 오답 복습 ("+wl.length+"개):</p>";
        wl.forEach(function(m, k){
          h += "<div class='witem'><p><strong>" + (k+1) + ". 지문 핵심 요약</strong></p><p style='color:#e11d48; margin-top:2px;'>내가 고른 답: " + m.u + " ➔ <strong style='color:#059669'>정답: " + m.c + "</strong></p><p style='color:#64748b; margin-top:2px;'>" + m.ex + "</p></div>";
        });
        w.innerHTML = h;
      }
      var b = document.getElementById("nrb");
      if(rnd >= 10){
        b.innerText = "🏆 10회차 완주! 처음부터 다시 풀기";
        b.onclick = function(){ tot = 0; ir(1); };
      } else {
        b.innerText = "다음 랜덤 10문제 (제 " + (rnd+1) + "회차) ➔";
        b.onclick = function(){ ir(rnd+1); };
      }
    }

    function nr() { ir(rnd+1); }

    ir(1);
  </script>
</body>
</html>
