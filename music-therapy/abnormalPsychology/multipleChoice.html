<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이상심리학 중간고사 객관식 모의고사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .card { width: 100%; max-width: 620px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; height: fit-content; margin-bottom: 20px; }
    header { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; padding: 20px 16px; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-sub { font-size: 11px; background: rgba(99,102,241,0.25); border: 1px solid rgba(165,180,252,0.4); color: #c7d2fe; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .badge-rnd { font-size: 11px; background: rgba(251,191,36,0.2); border: 1px solid rgba(251,191,36,0.5); color: #fde68a; padding: 3px 8px; border-radius: 999px; font-weight: 800; }
    h1 { font-size: 18px; font-weight: 900; }
    .pbar-bg { width: 100%; height: 7px; background: #1e293b; border-radius: 999px; margin-top: 14px; overflow: hidden; }
    .pbar-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #34d399); width: 10%; transition: width 0.3s; }
    .prow { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-top: 6px; font-weight: 600; }
    section { padding: 18px 16px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
    .qtitle { font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.5; margin-bottom: 16px; }
    .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn { width: 100%; text-align: left; padding: 12px 14px; font-size: 13px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; cursor: pointer; transition: background 0.2s; line-height: 1.4; display: flex; justify-content: space-between; align-items: center; }
    .opt-btn:active { background: #f1f5f9; }
    .opt-correct { background: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: 800; }
    .opt-wrong { background: #fff1f2 !important; border-color: #f43f5e !important; color: #9f1239 !important; font-weight: 800; }
    .opt-dim { opacity: 0.4; }
    .fb { margin-top: 16px; border-radius: 14px; padding: 14px; display: none; }
    .fb-ok { background: #ecfdf5; border: 1px solid #a7f3d0; }
    .fb-no { background: #fff1f2; border: 1px solid #fecdd3; }
    .fbt { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .fb-ok .fbt { color: #065f46; }
    .fb-no .fbt { color: #9f1239; }
    .fbd { font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 12px; }
    .nbtn { width: 100%; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; padding: 12px; cursor: pointer; }
    .rsec { display: none; text-align: center; padding: 24px 16px; }
    .scbox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin: 16px 0; }
    .scnum { font-size: 32px; font-weight: 900; color: #4f46e5; margin: 4px 0; }
    .wlist { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; max-height: 240px; overflow-y: auto; font-size: 11px; margin-bottom: 16px; }
    .witem { border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 8px; }
    .witem:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="badge-row">
        <span class="badge-sub">음악치료 석사과정 | 중간고사 객관식</span>
        <span id="rb" class="badge-rnd">제 1 회차 / 총 10회차</span>
      </div>
      <h1>이상심리학 실전 4지선다 모의고사</h1>
      <div class="pbar-bg"><div id="pf" class="pbar-fill"></div></div>
      <div class="prow"><span id="pqt">문제 1 / 10</span><span id="rst">점수: 0 / 10</span></div>
    </header>

    <section id="qsec">
      <span id="cb" class="tag">단원명</span>
      <div id="qt" class="qtitle">문제를 불러오는 중...</div>
      <div id="opts" class="opt-list"></div>
      <div id="fbc" class="fb">
        <div id="ft" class="fbt"></div>
        <div id="fd" class="fbd"></div>
        <button type="button" id="nb" class="nbtn" onclick="nxt()">다음 문제 ➔</button>
      </div>
    </section>

    <section id="rsec" class="rsec">
      <h2 style="font-size: 20px; font-weight: 800;">🎯 회차 모의고사 완료!</h2>
      <div class="scbox">
        <div style="font-size: 12px; color: #64748b; font-weight: 600;">이번 회차 점수</div>
        <div id="fsc" class="scnum">0 / 10</div>
        <div id="cum" style="font-size: 11px; color: #059669; font-weight: 700;">누적 정답률: 0%</div>
      </div>
      <div id="wl" class="wlist"></div>
      <button type="button" id="nrb" class="nbtn" onclick="nr()">다음 랜덤 10문제 생성 ➔</button>
    </section>
  </div>

  <script>
    var POOL = [
      { c:"제1장 기초", q:"조증이나 반사회성 성격장애처럼 환자 스스로 고통을 느끼지 못할 때 이상으로 규정하기 어렵다는 한계를 지닌 판별 기준은?", o:["주관적 고통", "통계적 일탈", "사회문화적 규준 위반", "위험성"], a:0, ex:"주관적 고통(suffering) 기준은 본인이 괴로움을 느끼지 못하는 상태에 적용하기 어렵습니다." },
      { c:"제1장 기초", q:"면담 중 상담사나 의사가 직접 관찰할 수 있는 눈맞춤 결여나 느린 말속도 같은 객관적 지표를 지칭하는 용어는?", o:["징후(sign)", "증상(symptom)", "증후군(syndrome)", "병인론(etiology)"], a:0, ex:"주관적 호소는 증상(symptom), 객관적 관찰 지표는 징후(sign)입니다." },
      { c:"제2장 신경발달", q:"발달 시기에 시작되며, 개념·사회·실행 영역에서 지적 기능(IQ 70 미만)과 적응 기능 모두에 결함을 보이는 장애는?", o:["지적장애", "특정학습장애", "발달적 협응장애", "느린 학습자"], a:0, ex:"지적장애는 지적 기능 결함과 일상 적응 기능의 손상이 공존해야 합니다." },
      { c:"제2장 신경발달", q:"지능이나 어휘력은 정상이지만, 대화 차례 지키기나 상황 맥락에 맞추어 언어를 적절히 사용하는 규칙에만 결함이 있는 장애는?", o:["사회적(실용적) 의사소통장애", "언어장애", "말소리장애", "자폐스펙트럼장애"], a:0, ex:"상황과 상대방에 맞추어 언어의 실용적(화용론적) 규칙을 활용하는 기능에 결함이 있습니다." },
      { c:"제2장 신경발달", q:"사회적 상호작용 및 눈맞춤 결함과 함께 특정 상동 행동, 동일성 고집, 감각 반응 이상을 핵심으로 하는 신경발달장애는?", o:["자폐스펙트럼장애", "사회적 의사소통장애", "반응성 애착장애", "상동증적 운동장애"], a:0, ex:"사회적 상호작용 결함과 제한적·반복적 상동 행동이 2대 진단 기준입니다." },
      { c:"제2장 신경발달", q:"부주의 또는 과잉행동-충동성 증상이 12세 이전에 시작되어 학교와 가정 등 2곳 이상의 환경에서 확인되는 장애는?", o:["주의력결핍 과잉행동장애(ADHD)", "파괴적 기분조절부전장애", "품행장애", "발달적 협응장애"], a:0, ex:"ADHD는 몇 가지 증상이 12세 이전에 시작되어 2곳 이상의 환경에서 나타나야 합니다." },
      { c:"제2장 신경발달", q:"여러 가지 운동 틱과 1가지 이상의 음성 틱이 모두 나타나며, 첫 발병 이후 1년 이상 지속되고 18세 이전에 발병하는 장애는?", o:["뚜렛장애", "지속성 운동 또는 음성 틱장애", "일과성 틱장애", "상동증적 운동장애"], a:0, ex:"운동 틱과 음성 틱이 모두 존재하고 1년 이상 지속되면 뚜렛장애입니다." },
      { c:"제2장 신경발달", q:"운동 틱 또는 음성 틱 중 단 한 가지만 나타나며, 1년 이상 지속되고 18세 이전에 시작되는 장애는?", o:["지속성 운동 또는 음성 틱장애", "뚜렛장애", "발달적 협응장애", "말소리장애"], a:0, ex:"운동 또는 음성 틱 중 한 가지만 1년 이상 지속될 때 진단됩니다." },
      { c:"제3장 조현병 스펙트럼", q:"망상, 환청, 와해된 언어 등의 활성기 증상을 포함하여 전체 지속 징후가 최소 6개월 이상 계속되는 장애는?", o:["조현병", "조현양상장애", "단기정신병적장애", "조현정동장애"], a:0, ex:"활성기 증상 1개월 이상을 포함하여 전체 징후가 6개월 이상 지속되어야 합니다." },
      { c:"제3장 조현병 스펙트럼", q:"조현병의 활성기 진단 증상(사고장애)과 주요우울 또는 조증 삽화 같은 기분 증상이 동시에 나타나는 장애는?", o:["조현정동장애", "조현병", "I형 양극성장애", "망상장애"], a:0, ex:"조현병 증상과 기분장애 삽화가 동시에 발생하는 질환입니다." },
      { c:"제3장 조현병 스펙트럼", q:"조현병 활성기 증상을 충족하지만 전체 유병 지속 기간이 1개월 이상 6개월 미만인 장애는?", o:["조현양상장애", "조현병", "단기정신병적장애", "망상장애"], a:0, ex:"조현병과 증상이 같으나 기간이 1개월 이상 6개월 미만인 경우입니다." },
      { c:"제3장 조현병 스펙트럼", q:"환청이나 언어 와해 없이 현실에서 일어날 법한 기괴하지 않은 체계적 망상만 최소 1개월 이상 지속되는 장애는?", o:["망상장애", "조현병", "단기정신병적장애", "조현양상장애"], a:0, ex:"다른 활성기 증상 없이 체계적인 망상만 1개월 이상 지속됩니다." },
      { c:"제3장 조현병 스펙트럼", q:"정신병적 상태가 2주 이내에 급작스럽게 발생하여 1일 이상 1개월 미만 지속된 후 병전 기능으로 완전히 회복되는 장애는?", o:["단기정신병적장애", "조현양상장애", "적응장애", "조현병"], a:0, ex:"1개월 미만 지속되다가 병전 기능으로 완전히 회복됩니다." },
      { c:"제4장 기분관련장애", q:"우울 기분 또는 흥미/즐거움 상실 중 하나를 포함하여 5가지 이상의 증상이 연속 2주 이상 지속되는 질환은?", o:["주요우울장애", "지속성 우울장애", "파괴적 기분조절부전장애", "적응장애"], a:0, ex:"연속 2주 이상 5가지 증상이 지속될 때 주요우울장애로 진단됩니다." },
      { c:"제4장 기분관련장애", q:"성인 최소 2년 이상(소아 1년) 동안 우울한 기분이 지속되며, 연속 2개월 이상 증상이 호전되지 않는 만성 우울 상태는?", o:["지속성 우울장애(기분저하증)", "주요우울장애", "순환성 장애", "I형 양극성장애"], a:0, ex:"성인 기준 최소 2년간 만성적인 저조한 기분이 지속됩니다." },
      { c:"제4장 기분관련장애", q:"만 6~18세 아동 청소년에게 진단되며, 주 3회 이상의 비정상적 분노 발작과 발작 사이 만성 과민성을 보이는 장애는?", o:["파괴적 기분조절부전장애(DMDD)", "I형 양극성장애", "주의력결핍 과잉행동장애", "품행장애"], a:0, ex:"아동기 양극성 장애 과잉진단 방지를 위해 신설되었으며 주 3회 분노 발작이 기준입니다." },
      { c:"제4장 기분관련장애", q:"우울 삽화 유무와 무관하게, 최소 1주일 지속되는 심각한 조증 삽화가 평생 단 1회라도 발생했을 때 진단되는 장애는?", o:["I형 양극성장애", "II형 양극성장애", "순환성 장애", "주요우울장애"], a:0, ex:"입원이 필요하거나 1주일 이상 지속되는 조증이 1회라도 있으면 진단됩니다." },
      { c:"제4장 기분관련장애", q:"조증 삽화는 전혀 없으나, 최소 4일 지속되는 경조증 삽화와 주요우울 삽화가 번갈아 반복되는 기분장애는?", o:["II형 양극성장애", "I형 양극성장애", "순환성 장애", "지속성 우울장애"], a:0, ex:"조증 없이 경조증 삽화(4일)와 주요우울 삽화가 교대로 나타납니다." },
      { c:"제5장 불안장애", q:"주요 애착 대상과의 분리에 대해 발달 수준을 벗어난 극심한 불안을 보이며 등교 거부나 악몽을 동반하는 장애는?", o:["분리불안장애", "선택적 함구증", "광장공포증", "사회공포증"], a:0, ex:"애착 대상과의 분리에 대한 비정상적 불안으로 아동 4주, 성인 6개월 이상 지속됩니다." },
      { c:"제5장 불안장애", q:"친숙한 곳에서는 말을 잘하지만 학교 등 특정 사회적 상황에서 최소 1개월 이상 일관되게 말을 하지 않는 장애는?", o:["선택적 함구증", "언어장애", "사회공포증", "자폐스펙트럼장애"], a:0, ex:"말을 해야 하는 특정 상황에서 1개월 이상 일관되게 침묵합니다." },
      { c:"제5장 불안장애", q:"예기치 못한 공황발작의 반복과 함께, 추가 발작에 대한 지속적인 예기불안이나 회피가 1개월 이상 지속되는 장애는?", o:["공황장애", "광장공포증", "특정공포증", "범불안장애"], a:0, ex:"발작 후 1개월 이상의 예기불안이나 행동 변화가 필수적입니다." },
      { c:"제5장 불안장애", q:"대중교통, 열린 공간, 밀폐 공간, 줄 서기, 집 밖 혼자 있기 중 2가지 이상에서 즉각 탈출이 어려울까 봐 회피하는 장애는?", o:["광장공포증", "사회공포증", "특정공포증", "분리불안장애"], a:0, ex:"곤란한 증상 시 탈출이나 도움 요청이 어려울 것으로 예상되는 장소를 회피합니다." },
      { c:"제5장 불안장애", q:"사소하고 작은 일들에 대해 만성적이고 통제하기 힘든 과도한 부동성 불안과 걱정이 최소 6개월 이상 지속되는 장애는?", o:["범불안장애(GAD)", "공황장애", "적응장애", "강박장애"], a:0, ex:"광범위한 일상 사건들에 대한 만성 걱정과 불안이 6개월 이상 지속됩니다." },
      { c:"제6장 강박관련", q:"침투적 강박사고와 이를 중화하기 위한 반복적 강박행동(손 씻기, 확인 등)으로 하루 1시간 이상을 소모하는 장애는?", o:["강박장애(OCD)", "신체변형장애", "범불안장애", "저장장애"], a:0, ex:"강박사고와 이를 중화하기 위한 의례적 강박행동이 특징입니다 (치료: ERP)." },
      { c:"제6장 강박관련", q:"타인이 볼 때는 미미하거나 없는 외모 결함에 병적으로 집착하여 거울 확인, 과도한 치장, 비교 행동을 반복하는 장애는?", o:["신체변형장애(BDD)", "강박장애", "피부뜯기장애", "건강염려증"], a:0, ex:"미미한 외모 결함에 대한 과도한 몰두와 반복적 확인 행동을 보입니다." },
      { c:"제6장 강박관련", q:"물건의 실제 가치와 상관없이 버리는 것을 어려워하여 생활공간이 물건에 의해 잠식되는 장애는?", o:["저장장애", "강박장애", "적응장애", "신체변형장애"], a:0, ex:"물건을 버리지 못해 생활공간이 물건에 의해 잠식되는 수집광 질환입니다." },
      { c:"제6장 강박관련", q:"자신의 두피나 눈썹 등 신체에 난 털을 반복적으로 뽑아 뚜렷한 탈모로 이어지는 장애는?", o:["털뽑기장애(발모광)", "피부뜯기장애", "틱장애", "상동증적 운동장애"], a:0, ex:"털을 반복적으로 뽑아 탈모를 초래하는 충동 조절 장애입니다 (치료: HRT)." },
      { c:"제7장 외상/스트레스", q:"인식 가능한 일상 스트레스 시작 후 3개월 이내 발병하며, 스트레스 종료 후 6개월 이상 지속되지 않는 장애는?", o:["적응장애", "급성스트레스장애", "외상후 스트레스 장애", "주요우울장애"], a:0, ex:"일상 스트레스 후 3개월 이내 발병하고 6개월 이내 종료됩니다." },
      { c:"제7장 외상/스트레스", q:"극심한 외상 사건 노출 후 나타나는 스트레스 반응이 사건 후 3일에서 1개월 이내로 종결되는 장애는?", o:["급성스트레스장애(ASD)", "외상후 스트레스 장애(PTSD)", "적응장애", "공황장애"], a:0, ex:"외상 후 반응이 1개월 이내에 종료되는 경우입니다 (1개월 이상은 PTSD)." },
      { c:"제7장 외상/스트레스", q:"실제적이거나 위협적인 죽음 등 극심한 외상 사건 노출 후 플래시백, 침습 기억, 과각성이 1개월 이상 지속되는 장애는?", o:["외상후 스트레스 장애(PTSD)", "급성스트레스장애", "적응장애", "지속성 비탄장애"], a:0, ex:"외상 사건 후 핵심 증상들이 1개월 이상 장기 지속됩니다." },
      { c:"제7장 외상/스트레스", q:"사별 후 성인 기준 최소 12개월(소아 6개월) 이상 고인에 대한 극심한 갈망과 정체성 붕괴가 지속되는 장애는?", o:["지속성 비탄장애", "주요우울장애", "적응장애", "외상후 스트레스 장애"], a:0, ex:"친밀한 대상의 사별 후 12개월 이상 애도 반응이 지속되는 질환입니다." },
      { c:"제7장 외상/스트레스", q:"극단적 방임으로 인해 고통스러운 상황에서도 보호자에게 위안을 구하지 않고 정서적으로 위축·억제된 행동을 보이는 장애는?", o:["반응성 애착장애(RAD)", "탈억제성 사회적 유대감 장애", "자폐스펙트럼장애", "분리불안장애"], a:0, ex:"방임으로 인해 양육자에게 위안을 구하지 않는 억제형 애착 질환입니다." },
      { c:"제7장 외상/스트레스", q:"방임 경험 이후 낯선 성인에 대한 조심성이나 경계심이 완전히 결여되어 무분별하게 친근하게 접근하는 장애는?", o:["탈억제성 사회적 유대감 장애(DSED)", "반응성 애착장애", "주의력결핍 과잉행동장애", "자폐스펙트럼장애"], a:0, ex:"낯선 성인에 대한 조심성이 결여되어 무분별하게 다가갑니다." },
      { c:"제7장 8번 범위끝", q:"2개 이상의 구별되는 독립적인 성격 상태와 일상적 망각을 넘어서는 기억 공백을 동반하는 해리장애는?", o:["해리성 정체감 장애(DID)", "조현병", "해리성 기억상실증", "경계선 성격장애"], a:0, ex:"중간고사 범위(7주차 8번)의 최종 장애로 구 다중인격장애입니다." }
    ];

    var rnd = 1, cur = [], idx = 0, sc = 0, tot = 0, ans = false, wl = [];
    function shf(a) { var c=a.slice(); for(var i=c.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=c[i]; c[i]=c[j]; c[j]=t; } return c; }

    function ir(r) {
      rnd = r; idx = 0; sc = 0; ans = false; wl = [];
      var shuffledPool = shf(POOL);
      cur = shuffledPool.slice(0, 10).map(function(q) {
        var correctText = q.o[q.a];
        var shuffledOpts = shf(q.o);
        return {
          c: q.c, q: q.q, o: shuffledOpts, a: shuffledOpts.indexOf(correctText), ex: q.ex
        };
      });

      document.getElementById("rb").innerText = "제 " + rnd + " 회차 / 총 10회차";
      document.getElementById("qsec").style.display = "block";
      document.getElementById("rsec").style.display = "none";
      rq();
    }

    function rq() {
      ans = false; var q = cur[idx];
      document.getElementById("pqt").innerText = "문제 " + (idx+1) + " / 10";
      document.getElementById("rst").innerText = "점수: " + sc + " / 10";
      document.getElementById("pf").style.width = ((idx+1)*10) + "%";
      document.getElementById("cb").innerText = q.c;
      document.getElementById("qt").innerText = q.q;
      document.getElementById("fbc").style.display = "none";

      var optsContainer = document.getElementById("opts");
      optsContainer.innerHTML = "";

      q.o.forEach(function(optText, optIdx) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn";
        btn.innerHTML = "<span>" + (optIdx+1) + ". " + optText + "</span><span class='ind' style='font-size:11px; font-weight:800;'></span>";
        btn.onclick = function() { check(optIdx); };
        optsContainer.appendChild(btn);
      });
    }

    function check(selIdx) {
      if(ans) return;
      ans = true;
      var q = cur[idx];
      var isOk = (selIdx === q.a);
      if(isOk) { sc++; tot++; } else {
        wl.push({ q: q.q, u: q.o[selIdx], c: q.o[q.a], ex: q.ex });
      }

      var btns = document.getElementById("opts").querySelectorAll("button");
      btns.forEach(function(b, i) {
        b.disabled = true;
        var ind = b.querySelector(".ind");
        if(i === q.a) {
          b.className = "opt-btn opt-correct";
          ind.innerText = "✓ 정답";
        } else if(i === selIdx) {
          b.className = "opt-btn opt-wrong";
          ind.innerText = "✕ 오답";
        } else {
          b.className = "opt-btn opt-dim";
        }
      });

      var fbc = document.getElementById("fbc");
      var ft = document.getElementById("ft");
      var fd = document.getElementById("fd");
      fbc.style.display = "block";
      fbc.className = "fb " + (isOk ? "fb-ok" : "fb-no");
      ft.innerText = isOk ? "🎉 정답입니다!" : "💡 오답 (정답: " + q.o[q.a] + ")";
      fd.innerText = q.ex;
      document.getElementById("rst").innerText = "점수: " + sc + " / 10";
      document.getElementById("nb").innerText = (idx===9 ? "회차 성적 확인하기 📊" : "다음 문제 ➔");
    }

    function nxt() { if(idx<9){ idx++; rq(); } else { sr(); } }

    function sr() {
      document.getElementById("qsec").style.display = "none";
      document.getElementById("rsec").style.display = "block";
      document.getElementById("fsc").innerText = sc + " / 10";
      var rate = Math.round((tot / (rnd * 10)) * 100);
      document.getElementById("cum").innerText = "누적 정답률: " + rate + "% (" + tot + " / " + (rnd * 10) + ")";
      var w = document.getElementById("wl"); w.innerHTML = "";
      if(wl.length === 0){
        w.innerHTML = "<p style='color:#059669; font-weight:bold; text-align:center;'>✨ 대단합니다! 10문제 모두 맞히셨습니다!</p>";
      } else {
        var h = "<p style='font-weight:bold; color:#e11d48; margin-bottom:6px;'>⚠️ 이번 회차 오답 복습 ("+wl.length+"개):</p>";
        wl.forEach(function(m, k){
          h += "<div class='witem'><p><strong>" + (k+1) + ". " + m.q + "</strong></p><p style='color:#e11d48'>내가 고른 답: " + m.u + " ➔ <strong style='color:#059669'>정답: " + m.c + "</strong></p><p style='color:#64748b; margin-top:2px;'>" + m.ex + "</p></div>";
        });
        w.innerHTML = h;
      }
      var b = document.getElementById("nrb");
      if(rnd >= 10){
        b.innerText = "🏆 10회차 완주! 처음부터 다시 풀기";
        b.onclick = function(){ tot = 0; ir(1); };
      } else {
        b.innerText = "다음 랜덤 10문제 (제 " + (rnd+1) + "회차) ➔";
        b.onclick = function(){ ir(rnd+1); };
      }
    }

    function nr() { ir(rnd+1); }

    ir(1);
  </script>
</body>
</html>
