    function inferDiagnosis() {
      var raw = document.getElementById("input-desc").value.trim();
      if (!raw) { alert("지문을 입력해 주세요!"); return; }

      var clean = normalize(raw);
      var best = null;
      var highestScore = -1;

      MASTER_DB.forEach(function(item) {
        var score = 0;
        item.primaryKeys.forEach(function(pk) {
          if (clean.indexOf(normalize(pk)) !== -1) {
            score += 40;
          }
        });
        item.secondaryKeys.forEach(function(sk) {
          if (clean.indexOf(normalize(sk)) !== -1) {
            score += 10;
          }
        });

        if (score > highestScore) {
          highestScore = score;
          best = item;
        }
      });

      var box = document.getElementById("result-box");
      box.style.display = "block";

      if (highestScore >= 12 && best) {
        document.getElementById("res-chapter").innerText = "📌 " + best.ch + " (일치도: " + highestScore + "점)";
        document.getElementById("res-diag").innerText = best.name;
        document.getElementById("res-content").innerHTML = best.detailHTML;
        document.getElementById("res-synonyms").innerText = "* 시험 주관식 답안 인정 표기: " + best.syn;
      } else {
        document.getElementById("res-chapter").innerText = "⚠️ 판별 불가";
        document.getElementById("res-diag").innerText = "핵심 진단 단서 부족";
        document.getElementById("res-content").innerHTML = "<div class='sub-card'>슬라이드의 핵심 키워드(예: MAOIs, 인지재구성, GABA, 대중교통 등)를 더 포함해 보세요.</div>";
        document.getElementById("res-synonyms").innerText = "";
      }
    }

    function putSample() {
      document.getElementById("input-desc").value = "• 약물치료 : MAOIs 와 SSRIs 와 같은 항우울제와 벤조다이아제핀 계열의 항불안제\n• 노출치료 : 사회공포를 가진 내담자가 두려운 상황에 자신을 노출하고 공포감이 줄어들 때까지 그 상황을 견디도록 도와줌.\n• 인지치료 : 인지재구성 cognitive restructuring 을 통해 기저의 부정적인 사고와 자동적 사고를 인식 (예; “아무도 나에게 흥미가 없어”“나는 재미있게 말할 수 없어”)\n• 사회공포증 아동을 위한 사회기술훈련, 데이트 공포를 느끼는 청년을 위한 사회기술훈련, 자기주장훈련, 역할훈련 role play 등";
      inferDiagnosis();
    }
