    .res-header { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; }
    .res-diag { font-size: 20px; font-weight: 900; color: #4f46e5; margin-bottom: 10px; }
    .res-sec { font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 8px; }

    function inferDiagnosis() {
      var raw = document.getElementById("input-desc").value.trim();
      if (!raw) { alert("지문을 입력해 주세요!"); return; }

      var clean = normalize(raw);
      var best = null;
      var highestScore = -1;

      MASTER_DB.forEach(function(item) {
        var score = 0;

        // 1. 긴 문장형 1차 키워드 일치 시 대폭 가점 (+35점)
        item.primaryKeys.forEach(function(pk) {
          if (clean.indexOf(normalize(pk)) !== -1) {
            score += 35;
          }
        });

        // 2. 단어 토큰형 2차 키워드 일치 시 가점 (+10점)
        item.secondaryKeys.forEach(function(sk) {
          if (clean.indexOf(normalize(sk)) !== -1) {
            score += 10;
          }
        });

        // 비교/감별 문맥 패널티 처리 (다른 질환 비교 설명 시 오진단 방지)
        if (item.name.indexOf("조현병 (") !== -1) {
          if (clean.indexOf("조현병보다는") !== -1 || clean.indexOf("조현병과구분") !== -1 || clean.indexOf("조현병으로발전") !== -1) {
            score -= 50;
          }
        }
        if (item.name.indexOf("자폐스펙트럼") !== -1) {
          if (clean.indexOf("자폐처럼보이나자폐는아니다") !== -1 || clean.indexOf("자폐스펙트럼장애를만족시키지않음") !== -1) {
            score -= 50;
          }
        }
        if (item.name.indexOf("I형 양극성") !== -1) {
          if (clean.indexOf("조증삽화는겪지않았으나") !== -1 || clean.indexOf("조증삽화가존재하지않는다") !== -1 || clean.indexOf("조증삽화는없어야함") !== -1) {
            score -= 50;
          }
        }
        if (item.name.indexOf("강박장애") !== -1) {
          // 외모 결함에만 집중한다는 비교 문맥 시 신체변형장애로 양보
          if (clean.indexOf("외모의결함에만집중한다는점에서강박장애와다름") !== -1) {
            score -= 50;
          }
        }

        if (score > highestScore) {
          highestScore = score;
          best = item;
        }
      });

      var box = document.getElementById("result-box");
      box.style.display = "block";

      if (highestScore >= 15 && best) {
        document.getElementById("res-chapter").innerText = "📌 " + best.ch;
        document.getElementById("res-diag").innerText = best.name;
        document.getElementById("res-reason").innerHTML = "<strong>💡 판별 근거 (교재 원문):</strong> " + best.desc;
        document.getElementById("res-period").innerHTML = "<strong>⏱ DSM-5 핵심 진단/기간 기준:</strong> " + best.period;
        document.getElementById("res-synonyms").innerText = "* 주관식 정답 인정 표기: " + best.syn;
      } else {
        document.getElementById("res-chapter").innerText = "⚠️ 판별 불가";
        document.getElementById("res-diag").innerText = "핵심 진단 단서 부족";
        document.getElementById("res-reason").innerText = "교재 본문 문장이나 DSM-5 기준 번호(A, B 등)를 복사해 넣어보세요.";
        document.getElementById("res-period").innerText = "";
        document.getElementById("res-synonyms").innerText = "";
      }
    }

    function putSample() {
      document.getElementById("input-desc").value = "강박사고와 강박행동이 특징적임. 강박적인 생각으로는 반복적이고 지속적으로 나타나는 오염에 대한 사고, 폭력적이거나 공포스러운 장면들과 같은 이미지, 누군가를 찌르는 것과 같은 충동들이 포함. 강박행동은 강박적인 생각에 대한 반응으로 일어남";
      inferDiagnosis();
    }
