<!DOCTYPE html>

  <style>
    :root {

    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; }
    body { background-color: var(--bg); color: var(--dark); line-height: 1.7; padding: 40px 20px; }
    .container { max-width: 920px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; padding: 35px 25px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }

    header p { color: var(--gray); font-size: 15px; }
    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn-global { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-global:hover { background: var(--primary); color: #fff; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 24px; margin-bottom: 22px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge-cat { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 15px; background: var(--primary-light); color: var(--primary); }
    .badge-type { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #f1f5f9; color: #475569; margin-left: 6px; }
    .q-num { font-size: 13.5px; color: var(--gray); font-weight: bold; }
    .q-text { font-size: 16.5px; font-weight: 800; color: #0f172a; margin-bottom: 12px; }
    .q-prompt { font-size: 14.5px; color: #1e293b; background: #f8fafc; padding: 14px 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
    textarea { width: 100%; min-height: 80px; padding: 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 14px; resize: vertical; outline: none; transition: border 0.2s; background: #fafafa; }
    textarea:focus { border-color: var(--primary); background: #fff; }
    .btn-toggle { margin-top: 10px; background: var(--primary); color: #fff; border: none; padding: 8px 16px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-toggle:hover { background: var(--secondary); }
    .answer-box { display: none; margin-top: 14px; padding: 18px; background: #fcfdfd; border: 1.5px dashed var(--accent); border-radius: 8px; }
    .answer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .answer-box h4 { color: #047857; font-size: 14.5px; font-weight: 800; margin: 0; }
    .source-tag { font-size: 12px; font-weight: 700; color: #0369a1; background: #e0f2fe; padding: 2px 8px; border-radius: 4px; }
    .answer-box p { font-size: 14px; color: #1e293b; margin-bottom: 8px; text-align: justify; }
    .criteria { font-size: 12.5px; color: #64748b; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; background: #f8fafc; padding: 8px; border-radius: 6px; }
    .criteria strong { color: #b91c1c; }
  </style>
</head>

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = questions.map((q, idx) => `
    <div class="card" id="card-${idx}">
      <div class="card-header">
        <div>
          <span class="badge-cat">${q.c}</span>
          <span class="badge-type">${q.t}</span>
        </div>
        <span class="q-num">문항 ${idx + 1} / 50</span>
      </div>
      <div class="q-text">${idx + 1}. ${q.title}</div>
      <div class="q-prompt">${q.p.replace(/\n/g, '<br>')}</div>
      <textarea placeholder="정확한 진단명과 교재의 핵심 기준을 포함하여 답안을 작성해보세요..."></textarea>
      <button class="btn-toggle" onclick="toggleAnswer(this)">모범답안 및 채점 기준</button>
      <div class="answer-box">
        <div class="answer-header">
          <h4>[표준 모범답안]</h4>
          <span class="source-tag">출처: ${q.src}</span>
        </div>
        <p>${q.a}</p>
        <div class="criteria">
          <strong>핵심 채점 기준:</strong> ${q.cr}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleAnswer(btn) {
  const box = btn.nextElementSibling;
  if (box.style.display === "block") {
    box.style.display = "none";
    btn.textContent = "모범답안 및 채점 기준";
    btn.style.background = "var(--primary)";
  } else {
    box.style.display = "block";
    btn.textContent = "답안 닫기";
    btn.style.background = "#059669";
  }
}

function expandAll() {
  document.querySelectorAll('.answer-box').forEach(b => b.style.display = "block");
  document.querySelectorAll('.btn-toggle').forEach(b => {
    b.textContent = "답안 닫기";
    b.style.background = "#059669";
  });
}

function collapseAll() {
  document.querySelectorAll('.answer-box').forEach(b => b.style.display = "none");
  document.querySelectorAll('.btn-toggle').forEach(b => {
    b.textContent = "모범답안 및 채점 기준";
    b.style.background = "var(--primary)";
  });
}

renderQuiz();
</script>
