<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이상심리학 전범위 정밀 주관식 단답형 모의고사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .card { width: 100%; max-width: 760px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; height: fit-content; margin-bottom: 25px; }
    header { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; padding: 22px 18px; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-sub { font-size: 11px; background: rgba(99,102,241,0.25); border: 1px solid rgba(165,180,252,0.4); color: #c7d2fe; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .badge-rnd { font-size: 11px; background: rgba(251,191,36,0.2); border: 1px solid rgba(251,191,36,0.5); color: #fde68a; padding: 3px 8px; border-radius: 999px; font-weight: 800; }
    h1 { font-size: 19px; font-weight: 900; }
    .pbar-bg { width: 100%; height: 7px; background: #1e293b; border-radius: 999px; margin-top: 14px; overflow: hidden; }
    .pbar-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #34d399); width: 10%; transition: width 0.3s; }
    .prow { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-top: 6px; font-weight: 600; }
    section { padding: 20px 18px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
    .hgroup { float: right; display: flex; gap: 6px; }
    .hbtn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #475569; cursor: pointer; }
    .hint { clear: both; background: #fef3c7; border: 1px solid #fde68a; border-radius: 10px; padding: 12px; font-size: 12px; color: #92400e; margin-bottom: 14px; display: none; line-height: 1.5; }
    .qcard { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 16px; clear: both; }
    .qcard p.lead { font-size: 11px; color: #4f46e5; font-weight: 800; margin-bottom: 6px; }
    .qcard h2 { font-size: 13.5px; font-weight: 500; color: #0f172a; line-height: 1.7; white-space: pre-line; }
    .qcard h2 strong { color: #312e81; font-weight: 800; }
    .inrow { display: flex; gap: 8px; margin-bottom: 6px; }
    .in { flex: 1; padding: 12px 14px; font-size: 15px; font-weight: 700; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; }
    .in:focus { border-color: #4f46e5; }
    .sbtn { background: #4f46e5; color: #fff; font-weight: 700; font-size: 13px; border: none; border-radius: 12px; padding: 0 18px; cursor: pointer; }
    .fb { margin-top: 16px; border-radius: 14px; padding: 14px; display: none; line-height: 1.6; }
    .fb-ok { background: #ecfdf5; border: 1px solid #a7f3d0; }
    .fb-no { background: #fff1f2; border: 1px solid #fecdd3; }
    .fbt { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    .fb-ok .fbt { color: #065f46; }
    .fb-no .fbt { color: #9f1239; }
    .fbd { font-size: 12px; color: #334155; }
    .nbtn { width: 100%; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; padding: 12px; cursor: pointer; margin-top: 10px; }
    .rsec { display: none; text-align: center; padding: 26px 18px; }
    .scbox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; margin: 18px 0; }
    .scnum { font-size: 34px; font-weight: 900; color: #4f46e5; margin: 6px 0; }
    .wlist { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; max-height: 280px; overflow-y: auto; font-size: 11.5px; margin-bottom: 16px; line-height: 1.6; }
    .witem { border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
    .witem:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="badge-row">
        <span class="badge-sub">이상심리학 | 특징·원인·치료 전수 상세</span>
        <span id="rb" class="badge-rnd">제 1 회차 / 총 10회차</span>
      </div>
      <h1>이상심리학 정밀 주관식 단답형</h1>
      <div class="pbar-bg"><div id="pf" class="pbar-fill"></div></div>
      <div class="prow"><span id="pqt">문제 1 / 10</span><span id="rst">정답: 0 / 10</span></div>
    </header>

    <section id="qsec">
      <div>
        <span id="cb" class="tag">단원명</span>
        <div class="hgroup">
          <button type="button" class="hbtn" onclick="th('c')">💡 초성</button>
          <button type="button" class="hbtn" onclick="th('p')">⏱ 기간/원인단서</button>
        </div>
      </div>
      <div id="hb" class="hint"></div>
      <div class="qcard">
        <p class="lead">[교재 상세 임상 특징, 신경생물학/심리학적 원인 및 치료 기법]</p>
        <h2 id="qt">문제를 불러오는 중...</h2>
      </div>
      <div class="inrow">
        <input type="text" id="ans" class="in" placeholder="정답 진단명 입력 후 [확인]" autocomplete="off" />
        <button type="button" class="sbtn" onclick="sub()">확인</button>
      </div>
      <div id="fbc" class="fb">
        <div id="ft" class="fbt"></div>
        <div id="fd" class="fbd"></div>
        <button type="button" id="nb" class="nbtn" onclick="nxt()">다음 문제 ➔</button>
      </div>
    </section>

    <section id="rsec" class="rsec">
      <h2 style="font-size: 20px; font-weight: 800;">🎉 회차 모의고사 완료!</h2>
      <div class="scbox">
        <div style="font-size: 12px; color: #64748b; font-weight: 600;">이번 회차 점수</div>
        <div id="fsc" class="scnum">0 / 10</div>
        <div id="cum" style="font-size: 11.5px; color: #059669; font-weight: 700;">누적 정답률: 0%</div>
      </div>
      <div id="wl" class="wlist"></div>
      <button type="button" id="nrb" class="nbtn" onclick="nr()">다음 랜덤 10문제 생성 ➔</button>
    </section>
  </div>

  <script>
    var POOL = [
      // ==================== 제5장 불안장애: 범불안장애 (슬라이드 2~5쪽 100% 반영) ====================
      {
        c: "제5장 불안장애",
        q: "• <strong>DSM-5 진단기준:</strong> 다양한 일상 활동에 대해 적어도 6개월 이상 통제하기 어려운 과도한 불안과 걱정이 발생하며, 다음 6가지 신체/인지 증상(①안절부절못함/가장자리에 선 느낌, ②쉽게 피로해짐, ③집중 곤란/머릿속이 하얘짐, ④과민성, ⑤근육 긴장, ⑥수면 장애) 중 3가지 이상 동반 (아동은 1가지만 필요).\n" +
           "• <strong>임상 특징:</strong> 걱정이 전반적이고 극심하며 유발요인 없이도 발생함. 여성 호발. 청소년기는 학교 수행에 관한 걱정이 많고 노년층은 가족 안녕과 신체 건강에 대한 걱정이 대부분임.\n" +
           "• <strong>원인론:</strong> 신경전달물질 GABA 수용기가 너무 작거나 결합 지연; 전전두엽-전대상회-편도체 회로 기능 저하; 부모의 처벌/과잉보호로 인한 신경증적·도덕적 불안; 비합리적 가정 및 걱정하는 것 자체를 위험하다고 두려워하는 <strong>초걱정(meta-worry)</strong>; 발생 가능성이 낮아도 확실성을 찾지 못해 불안한 <strong>'불확실성을 견딜 수 없다는 이론(IU)'</strong>; 신체 각성을 회피하기 위해 걱정으로 도피한다는 <strong>'회피 이론'</strong>.\n\n" +
           "이 장애의 공식 진단명은?",
        a: "범불안장애",
        s: ["범불안장애", "범 불안 장애", "gad"],
        ch: "ㅂㅂㅇㅈㅇ",
        ph: "6개월 이상 만성 걱정 / GABA 결함 / 초걱정 / 불확실성 불내성(IU) / 회피 이론",
        ex: "슬라이드 2~5쪽에 수록된 범불안장애(GAD)의 진단기준 A·B·C, 6가지 신체증상, 청소년/노년층 걱정 주제, GABA 이상, 초걱정, 불확실성 불내성, 회피 이론이 모두 일치합니다."
      },

      // ==================== 제5장 불안장애: 공황장애 ====================
      {
        c: "제5장 불안장애",
        q: "• <strong>임상 특징:</strong> 특별한 유발 자극 없이 심계항진, 질식감, 어지러움, 죽을 것 같은 공포가 몇 분 내 최고조에 달하는 발작이 반복됨. 발작 후 추가 발작에 대한 지속적 걱정(예기불안)이나 회피가 1개월 이상 지속됨.\n" +
           "• <strong>원인:</strong> 청반(Locus coeruleus)의 노르에피네프린 이상; 신체 감각을 재앙의 신호로 오해석하는 높은 불안민감도(anxiety sensitivity).\n" +
           "• <strong>치료:</strong> 과호흡이나 어지러움을 의도적으로 유발하여 직면·습관화시키는 <strong>내부감각수용 노출(Interoceptive Exposure)</strong> 및 공황통제치료.\n\n" +
           "이 장애의 진단명은?",
        a: "공황장애",
        s: ["공황장애", "공황 장애", "panic disorder"],
        ch: "ㄱㅎㅈㅇ",
        ph: "발작 후 1개월 이상 예기불안 / 노르에피네프린 이상 / 내부감각수용 노출",
        ex: "예기치 못한 공황발작과 1개월 이상의 예기불안, 노르에피네프린 이상, 신체감각의 파국적 오해석(불안민감도), 내부감각수용 노출치료가 특징인 공황장애입니다."
      },

      // ==================== 제5장 불안장애: 광장공포증 ====================
      {
        c: "제5장 불안장애",
        q: "• <strong>진단기준:</strong> ①대중교통 이용, ②열린 공간, ③밀폐된 공간, ④줄 서기/군중 속, ⑤집 밖 혼자 있기라는 5가지 상황 중 <strong>2가지 이상의 상황</strong>을 극도로 두려워하고 회피함.\n" +
           "• <strong>특징:</strong> 공황 증상이나 무력한 상황 발생 시 탈출하거나 도움을 받기 어려울 것이라는 공포로 인해 해당 장소를 6개월 이상 적극 회피하거나 동반자를 요구함.\n\n" +
           "이 장애의 진단명은?",
        a: "광장공포증",
        s: ["광장공포증", "광장 공포증", "agoraphobia"],
        ch: "ㄱㅈㄱㅍㅈ",
        ph: "5가지 장소 중 2가지 이상 지속 회피 (6개월 이상) / 탈출 곤란",
        ex: "5가지 장소 중 2곳 이상에서 탈출이나 도움 요청이 어려울 것이라는 두려움으로 회피가 지속되는 광장공포증입니다."
      },

      // ==================== 제6장 강박 및 관련 장애: 강박장애 ====================
      {
        c: "제6장 강박 및 관련 장애",
        q: "• <strong>임상 특징:</strong> 오염에 대한 사고, 찌르는 충동 등 원치 않는 침투적 강박사고와, 이를 중화하기 위해 엄격한 규칙대로 수행하는 손 씻기, 확인 등 강박행동에 하루 1시간 이상을 소모함.\n" +
           "• <strong>원인:</strong> 안와전두피질(OFC) 및 미상핵 과활성; 세로토닌 불균형; 생각을 통제하려 할수록 더 떠오르는 '북극곰 실험'; 생각을 하는 것만으로도 행동을 저지른 것과 같다고 믿는 <strong>사고-행위 융합(TAF)</strong> 인지 왜곡.\n" +
           "• <strong>치료:</strong> 불안 자극에 직면시킨 후 의례 행동을 막는 <strong>노출 및 반응 방지(ERP)</strong>.\n\n" +
           "이 장애의 진단명은?",
        a: "강박장애",
        s: ["강박장애", "강박증", "ocd"],
        ch: "ㄱㅂㅈㅇ",
        ph: "하루 1시간 이상 / 안와전두피질-미상핵 / 사고-행위 융합 / ERP",
        ex: "침투적 강박사고와 중화 목적의 강박행동(1시간 이상 소모), 안와전두피질-미상핵 이상, 사고-행위 융합, ERP 치료가 적용되는 강박장애입니다."
      },

      // ==================== 제6장 강박 및 관련 장애: 털뽑기장애 & 신체변형장애 ====================
      {
        c: "제6장 강박 및 관련 장애",
        q: "• <strong>임상 특징:</strong> 자신의 두피나 눈썹 등 털을 반복적으로 뽑아 뚜렷한 탈모로 이어지며 멈추려는 시도에 번번이 실패함. 뽑은 털을 삼킬 경우 위장관 내 결석을 형성하는 이식증 위험이 있음.\n" +
           "• <strong>치료:</strong> 충동 자각 훈련과 털을 뽑는 행동과 양립할 수 없는 대체 동작(주먹 쥐기 등)을 훈련하는 <strong>습관반전훈련(HRT)</strong> 및 수용증진행동치료(AEBT).\n\n" +
           "이 장애의 진단명은?",
        a: "털뽑기장애",
        s: ["털뽑기장애", "발모광", "털뽑기 장애"],
        ch: "ㅌㅃㄱㅈㅇ",
        ph: "반복적 털뽑기 및 탈모 / 이식증 위험 / 습관반전훈련(HRT)",
        ex: "털을 뽑아 탈모를 유발하는 장애로 경쟁 반응을 훈련하는 습관반전훈련(HRT)이 대표 치료법입니다."
      },
      {
        c: "제6장 강박 및 관련 장애",
        q: "• <strong>임상 특징:</strong> 타인이 볼 때는 미미하거나 알아보기 어려운 외모 결함에 병적으로 집착하여 하루 수 시간을 거울 확인, 과도한 치장, 타인과의 외모 비교 행동에 소모함.\n" +
           "• <strong>감별:</strong> 일반 강박장애와 달리 병적 몰두와 의례 행동이 '오직 자신의 외모 결함'에만 집중됨.\n\n" +
           "이 장애의 진단명은?",
        a: "신체변형장애",
        s: ["신체변형장애", "신체이형장애", "bdd"],
        ch: "ㅅㅊㅂㅎㅈㅇ",
        ph: "미미한 외모 결함에 병적 몰두 / 거울보기 / 강박장애와 감별",
        ex: "타인이 인지하지 못하는 외모 결함에 집착하여 반복적 확인/치장 행동을 보이는 신체변형장애(BDD)입니다."
      },

      // ==================== 제4장 기분과 관련된 장애: 주요우울장애 ====================
      {
        c: "제4장 기분과 관련된 장애",
        q: "• <strong>진단기준:</strong> 우울 기분 또는 흥미/즐거움 상실 중 하나를 필수 포함하여 식욕 저하, 불면, 무가치감, 피로 등 5가지 이상의 증상이 <strong>연속 2주 이상</strong> 지속됨.\n" +
           "• <strong>원인:</strong> 세로토닌·노르에피네프린 저하; 셀리그만의 학습된 무력감; 벡의 부정적 인지삼제(자기·세상·미래); 일조량 감소로 인한 멜라토닌 과다 분비(계절성 우울증 ➔ 광치료).\n" +
           "• <strong>치료:</strong> 항우울제(SSRIs) 및 인지행동치료(CBT).\n\n" +
           "이 질환의 정식 진단명은?",
        a: "주요우울장애",

      }
    ];

    var rnd = 1, cur = [], idx = 0, sc = 0, tot = 0, ans = false, wl = [];
    function nml(t) { return (t||"").toString().toLowerCase().replace(/[\s\-_(),.'"\n\r\t]/g, "").trim(); }
    function shf(a) { var c=a.slice(); for(var i=c.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=c[i]; c[i]=c[j]; c[j]=t; } return c; }
    
    function ir(r) {
      rnd = r; idx = 0; sc = 0; ans = false; wl = [];
      cur = shf(POOL).slice(0, 10);
      document.getElementById("rb").innerText = "제 " + rnd + " 회차 / 총 10회차";
      document.getElementById("qsec").style.display = "block";
      document.getElementById("rsec").style.display = "none";
      rq();
    }

    function rq() {
      ans = false; var q = cur[idx];
      document.getElementById("pqt").innerText = "문제 " + (idx+1) + " / 10";
      document.getElementById("rst").innerText = "정답: " + sc + " / 10";
      document.getElementById("pf").style.width = ((idx+1)*10) + "%";
      document.getElementById("cb").innerText = q.c;
      document.getElementById("qt").innerHTML = q.q;
      document.getElementById("hb").style.display = "none";
      var i = document.getElementById("ans"); i.value=""; i.disabled=false;
      document.getElementById("fbc").style.display = "none";
    }

    function th(t) {
      var q = cur[idx], b = document.getElementById("hb");
      b.style.display = "block";
      b.innerHTML = (t==='c' ? "💡 <strong>초성 힌트:</strong> " + q.ch : "⏱ <strong>기간/핵심 단서:</strong> " + q.ph);
    }

    function sub() {
      if(ans) return;
      var i = document.getElementById("ans"), v = i.value.trim();
      if(!v) return;
      ans = true; i.disabled = true;
      var q = cur[idx], nv = nml(v);
      var ok = [q.a].concat(q.s).some(function(x){ return nml(x) === nv; });
      if(ok){ sc++; tot++; } else { wl.push({q:q.q, u:v, a:q.a, e:q.ex}); }
      
      var c = document.getElementById("fbc"), t = document.getElementById("ft"), d = document.getElementById("fd");
      c.style.display = "block";
      c.className = "fb " + (ok ? "fb-ok" : "fb-no");
      t.innerText = ok ? "🎉 정답입니다! 정확한 진단명입니다." : "💡 오답입니다. (작성 답안: " + v + ")";
      d.innerHTML = "<p><strong>표준 정답:</strong> " + q.a + "</p><p style='color:#64748b; margin-top:4px;'><strong>상세 해설:</strong> " + q.ex + "</p>";
      document.getElementById("rst").innerText = "정답: " + sc + " / 10";
      document.getElementById("nb").innerText = (idx===9 ? "회차 성적 확인하기 📊" : "다음 문제 ➔");
    }

    document.getElementById("ans").addEventListener("keypress", function(e){ if(e.key==="Enter") sub(); });

    function nxt() { if(idx<9){ idx++; rq(); } else { sr(); } }

    function sr() {
      document.getElementById("qsec").style.display = "none";
      document.getElementById("rsec").style.display = "block";
      document.getElementById("fsc").innerText = sc + " / 10";
      var rate = Math.round((tot / (rnd * 10)) * 100);
      document.getElementById("cum").innerText = "누적 정답률: " + rate + "% (" + tot + " / " + (rnd * 10) + ")";
      var w = document.getElementById("wl"); w.innerHTML = "";
      if(wl.length === 0){
        w.innerHTML = "<p style='color:#059669; font-weight:bold; text-align:center;'>✨ 대단합니다! 이번 회차 10문항을 모두 맞히셨습니다!</p>";
      } else {
        var h = "<p style='font-weight:bold; color:#e11d48; margin-bottom:8px;'>⚠️ 이번 회차 오답 복습 ("+wl.length+"개):</p>";
        wl.forEach(function(m, k){
          h += "<div class='witem'><p><strong>" + (k+1) + "번 문제 오답</strong></p><p style='color:#e11d48; margin-top:2px;'>내 답안: " + m.u + " ➔ <strong style='color:#059669'>정답: " + m.a + "</strong></p><p style='color:#64748b; margin-top:2px;'>" + m.e + "</p></div>";
        });
        w.innerHTML = h;
      }
      var b = document.getElementById("nrb");
      if(rnd >= 10){
        b.innerText = "🏆 10회차 완주! 처음부터 다시 풀기";
        b.onclick = function(){ tot = 0; ir(1); };
      } else {
        b.innerText = "다음 랜덤 10문제 (제 " + (rnd+1) + "회차) ➔";
        b.onclick = function(){ ir(rnd+1); };
      }
    }

    function nr() { ir(rnd+1); }

    ir(1);
  </script>
</body>
</html>
