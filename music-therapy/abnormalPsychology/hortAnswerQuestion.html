<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이상심리학 중간고사 주관식 모의고사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .card { width: 100%; max-width: 620px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; height: fit-content; margin-bottom: 20px; }
    header { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; padding: 20px 16px; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-sub { font-size: 11px; background: rgba(99,102,241,0.25); border: 1px solid rgba(165,180,252,0.4); color: #c7d2fe; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .badge-rnd { font-size: 11px; background: rgba(251,191,36,0.2); border: 1px solid rgba(251,191,36,0.5); color: #fde68a; padding: 3px 8px; border-radius: 999px; font-weight: 800; }
    h1 { font-size: 18px; font-weight: 900; }
    .pbar-bg { width: 100%; height: 7px; background: #1e293b; border-radius: 999px; margin-top: 14px; overflow: hidden; }
    .pbar-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #34d399); width: 10%; transition: width 0.3s; }
    .prow { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-top: 6px; font-weight: 600; }
    section { padding: 18px 16px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
    .hgroup { float: right; display: flex; gap: 6px; }
    .hbtn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer; }
    .hint { clear: both; background: #fef3c7; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; font-size: 12px; color: #92400e; margin-bottom: 14px; display: none; line-height: 1.4; }
    .qcard { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 16px; clear: both; }
    .qcard p.lead { font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 4px; }
    .qcard h2 { font-size: 14px; font-weight: 600; color: #0f172a; line-height: 1.5; }
    .inrow { display: flex; gap: 8px; margin-bottom: 6px; }
    .in { flex: 1; padding: 12px 14px; font-size: 15px; font-weight: 700; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; }
    .in:focus { border-color: #4f46e5; }
    .sbtn { background: #4f46e5; color: #fff; font-weight: 700; font-size: 13px; border: none; border-radius: 12px; padding: 0 16px; cursor: pointer; }
    .fb { margin-top: 16px; border-radius: 14px; padding: 14px; display: none; }
    .fb-ok { background: #ecfdf5; border: 1px solid #a7f3d0; }
    .fb-no { background: #fff1f2; border: 1px solid #fecdd3; }
    .fbt { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    .fb-ok .fbt { color: #065f46; }
    .fb-no .fbt { color: #9f1239; }
    .fbd { font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 12px; }
    .fbd strong { color: #4338ca; }
    .nbtn { width: 100%; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; padding: 12px; cursor: pointer; }
    .rsec { display: none; text-align: center; padding: 24px 16px; }
    .scbox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin: 16px 0; }
    .scnum { font-size: 32px; font-weight: 900; color: #4f46e5; margin: 4px 0; }
    .wlist { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; max-height: 240px; overflow-y: auto; font-size: 11px; margin-bottom: 16px; }
    .witem { border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 8px; }
    .witem:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="badge-row">
        <span class="badge-sub">음악치료 석사과정 | 중간고사 주관식</span>
        <span id="rb" class="badge-rnd">제 1 회차 / 총 10회차</span>
      </div>
      <h1>이상심리학 실전 주관식 단답형</h1>
      <div class="pbar-bg"><div id="pf" class="pbar-fill"></div></div>
      <div class="prow"><span id="pqt">문제 1 / 10</span><span id="rst">정답: 0 / 10</span></div>
    </header>

    <section id="qsec">
      <div>
        <span id="cb" class="tag">단원명</span>
        <div class="hgroup">
          <button type="button" class="hbtn" onclick="th('c')">💡 초성</button>
          <button type="button" class="hbtn" onclick="th('p')">⏱ 기간/단서</button>
        </div>
      </div>
      <div id="hb" class="hint"></div>
      <div class="qcard">
        <p class="lead">[임상 사례 및 진단 기준]</p>
        <h2 id="qt">문제를 불러오는 중...</h2>
      </div>
      <div class="inrow">
        <input type="text" id="ans" class="in" placeholder="정답 진단명(용어) 입력 후 확인" autocomplete="off" />
        <button type="button" class="sbtn" onclick="sub()">확인</button>
      </div>
      <div id="fbc" class="fb">
        <div id="ft" class="fbt"></div>
        <div id="fd" class="fbd"></div>
        <button type="button" id="nb" class="nbtn" onclick="nxt()">다음 문제 ➔</button>
      </div>
    </section>

    <section id="rsec" class="rsec">
      <h2 style="font-size: 20px; font-weight: 800;">🎉 회차 모의고사 완료!</h2>
      <div class="scbox">
        <div style="font-size: 12px; color: #64748b; font-weight: 600;">이번 회차 점수</div>
        <div id="fsc" class="scnum">0 / 10</div>
        <div id="cum" style="font-size: 11px; color: #059669; font-weight: 700;">누적 정답률: 0%</div>
      </div>
      <div id="wl" class="wlist"></div>
      <button type="button" id="nrb" class="nbtn" onclick="nr()">다음 랜덤 10문제 생성 ➔</button>
    </section>
  </div>

  <script>
    var POOL = [
      // 1장
      { c:"제1장 이상심리학 기초", q:"주관적으로 얼마나 고통스러운지 관점에서 평가하나, 조증이나 반사회성 성격장애처럼 스스로 고통을 느끼지 못하는 상태를 이상으로 규정하기 어렵다는 한계를 지닌 이상심리 판별 기준은?", a:"주관적 고통", s:["주관적인 고통", "주관적고통", "suffering"], ch:"ㅈㄱㅈ ㄱㅌ", ph:"스스로 느끼는 내적 고통 유무", ex:"조증이나 사이코패스는 주관적 고통이 없어 이 기준만으로는 이상 판별에 한계가 있습니다." },
      { c:"제1장 이상심리학 기초", q:"정상 분포에서 벗어났을 때를 이상으로 보며, 평균에서 ±2SD 이상 벗어난 경우(예: IQ 70 미만)를 이상으로 판단하는 기준은?", a:"통계적 일탈", s:["통계적일탈", "통계적 기준"], ch:"ㅌㄱㅈ ㅇㅌ", ph:"평균에서 ±2SD 벗어남 (IQ 70 미만)", ex:"통계적 일탈은 정상 분포 곡선의 평균에서 벗어난 양적 차이를 기준으로 합니다." },
      { c:"제1장 이상심리학 기초", q:"내담자가 주관적으로 호소하는 고통을 '증상(symptom)'이라 할 때, 면담 시 임상가가 직접 관찰할 수 있는 눈맞춤 결여나 느린 말속도 같은 객관적 관찰 지표는?", a:"징후", s:["징후", "sign"], ch:"ㅈㅎ", ph:"임상가가 직접 관찰 가능한 객관적 지표", ex:"주관적인 호소는 증상(symptom), 객관적 관찰 지표는 징후(sign)입니다." },

      // 2장
      { c:"제2장 신경발달장애", q:"발달 시기에 시작하여 개념, 사회, 실행 영역에서 지적 기능(IQ 70 미만)과 적응 기능 모두에 결함이 있으며, 개별 지능검사 결과로 진단되는 장애는?", a:"지적장애", s:["지적장애", "지적발달장애", "정신지체", "intellectual disability"], ch:"ㅈㅈㅈㅇ", ph:"발달시기 시작, IQ 70 미만 + 적응기능 3개 영역 결함", ex:"개념, 사회, 실행 영역의 적응 기능과 지적 기능 모두에 손상이 있어야 합니다." },
      { c:"제2장 신경발달장애", q:"표준화된 지능검사상 평균에서 -1SD ~ -2SD에 속하며 IQ가 71~84 정도로 특수교육 대상자는 아니지만 성인기 사회 부적응을 겪는 대상군은?", a:"느린 학습자", s:["느린학습자", "경계선 지능", "경계선지능"], ch:"ㄴㄹ ㅎㅅㅈ", ph:"IQ 71~84 (-1SD ~ -2SD)", ex:"전체 인구의 약 13.5%에 해당하며 특수교육 대상자는 아닙니다." },
      { c:"제2장 신경발달장애", q:"문법이나 어휘력 자체는 정상이지만, 대화 상대나 상황적 요구에 따라 말을 바꾸고 대화 순서를 지키는 등 사회적·실용적 규칙 활용에만 지속적인 결함을 보이는 장애는?", a:"사회적(실용적) 의사소통장애", s:["사회적(실용적) 의사소통장애", "사회적 의사소통장애", "실용적 의사소통장애", "사회적의사소통장애"], ch:"ㅅㅎㅈ ㅇㅅㅅㅌㅈㅇ", ph:"화용론적(실용적) 언어 규칙 결함 (4세 이후 진단)", ex:"문법 구조는 정상이나 상황 맥락에 맞는 화용론적 언어 사용에 결함이 있습니다." },
      { c:"제2장 신경발달장애", q:"사회적 상호작용 및 눈맞춤의 결함, 공동주의 능력 결함과 함께 제한적·반복적인 상동 행동, 동일성 고집, 감각 과잉/과소 반응을 특징으로 하는 장애는?", a:"자폐스펙트럼장애", s:["자폐스펙트럼장애", "자폐 스펙트럼 장애", "자폐증", "asd"], ch:"ㅈㅍㅅㅍㅌㄹㅈㅇ", ph:"사회적 상호작용 결함 + 상동행동 및 동일성 고집", ex:"사회적 의사소통 결함과 반복적 상동 행동이 2대 핵심 진단축입니다." },
      { c:"제2장 신경발달장애", q:"부주의 또는 과잉행동-충동성 증상이 12세 이전에 시작되어 학교와 가정 등 2곳 이상의 환경에서 기능 손상을 초래하는 신경발달장애는?", a:"주의력결핍 과잉행동장애", s:["주의력결핍 과잉행동장애", "주의력결핍과잉행동장애", "adhd"], ch:"ㅈㅇㄹㄱㅍ ㄱㅇㅎㄷㅈㅇ", ph:"12세 이전 발병, 2개 이상 환경, 6개월 이상", ex:"부주의 또는 과잉행동-충동성 증상이 12세 이전에 발병해야 합니다." },
      { c:"제2장 신경발달장애", q:"지능은 정상 수준이지만 핵심 학업 기술(단어 읽기, 철자 쓰기, 산술 계산 등) 습득에 현저한 어려움을 겪는 난독증(dyslexia)을 대표로 하는 장애는?", a:"특정학습장애", s:["특정학습장애", "특정 학습장애", "난독증"], ch:"ㅌㅈㅎㅅㅈㅇ", ph:"정상 지능 + 특정 학업 기술(읽기/쓰기/수학) 손상", ex:"정상 지능을 가졌으나 작업기억 결함 등으로 학업 기술 습득에 곤란을 겪습니다." },
      { c:"제2장 신경발달장애", q:"여러 가지 운동 틱과 1가지 이상의 음성 틱이 장애 경과 중 모두 나타나며, 틱 증상이 1년 이상 지속되고 18세 이전에 시작되는 장애는?", a:"뚜렛장애", s:["뚜렛장애", "투렛장애", "뚜렛증후군", "투렛증후군"], ch:"ㄸㄹㅈㅇ", ph:"운동 틱 + 음성 틱 모두, 1년 이상 지속, 18세 이전", ex:"운동 틱과 음성 틱이 모두 존재해야 뚜렛장애로 진단됩니다." },
      { c:"제2장 신경발달장애", q:"운동 틱 또는 음성 틱 중 단 한 가지만 나타나며, 첫 발병 이후 1년 이상 지속되고 18세 이전에 발병하는 장애는?", a:"지속성 운동 또는 음성 틱장애", s:["지속성 운동 또는 음성 틱장애", "지속성 틱장애", "만성 틱장애"], ch:"ㅈㅅㅅ ㅇㄷ ㄸㄴ ㅇㅅ ㅌㅈㅇ", ph:"운동 또는 음성 틱 중 한 가지만 1년 이상", ex:"둘 중 한 가지 틱만 1년 이상 지속되는 경우입니다." },
      { c:"제2장 신경발달장애", q:"단추 잠그기, 가위질, 달리기 등의 운동 협응 기술 습득이 또래에 비해 지연되고 움직임이 매우 서투르고 느리며 정확성이 부족한 장애는?", a:"발달적 협응장애", s:["발달적 협응장애", "발달적협응장애", "협응장애"], ch:"ㅂㄷㅈ ㅎㅇㅈㅇ", ph:"운동 순서 및 협응 능력의 지속적 서투름", ex:"운동 협응 기술의 습득과 실행이 발달 연령에 비해 현저히 떨어집니다." },
      { c:"제2장 신경발달장애", q:"목적 없이 머리나 손, 몸을 율동적으로 흔들거나 벽에 머리를 반복적으로 박는 등 억제할 수 없는 반복적 움직임을 통제하지 못하는 장애는?", a:"상동증적 운동장애", s:["상동증적 운동장애", "상동증적운동장애", "상동운동장애"], ch:"ㅅㄷㅈㅈ ㅇㄷㅈㅇ", ph:"목적 없는 반복적 신체 움직임, 자해/비자해", ex:"몸 흔들기, 머리 박기 등 억제할 수 없는 움직임이 나타납니다." },

      // 3장
      { c:"제3장 조현병 스펙트럼", q:"망상, 환각, 와해된 언어 등의 활성기 증상을 최소 1개월 이상 포함하여 전체 징후가 최소 6개월 이상 지속되는 정신증적 장애는?", a:"조현병", s:["조현병", "schizophrenia", "정신분열병", "정신분열증"], ch:"ㅈㅎㅂ", ph:"활성기 1개월 포함, 전체 최소 6개월 이상 지속", ex:"1개월 이상의 활성기 증상을 포함하여 전체 징후가 6개월 이상 지속되어야 합니다." },
      { c:"제3장 조현병 스펙트럼", q:"조현병의 활성기 진단 증상(사고장애)과 주요우울 또는 조증 삽화 같은 기분장애 증상이 동시에 지속적으로 나타나는 장애는?", a:"조현정동장애", s:["조현정동장애", "조현 정동 장애", "분열정동장애"], ch:"ㅈㅎㅈㄷㅈㅇ", ph:"조현병 증상 + 기분 삽화의 동시 존재", ex:"조현병 증상과 기분장애 삽화가 동시에 발생하는 질환입니다." },
      { c:"제3장 조현병 스펙트럼", q:"조현병의 활성기 진단 증상을 모두 충족하지만, 전체 유병 지속 기간이 1개월 이상 6개월 미만인 경우 진단되는 장애는?", a:"조현양상장애", s:["조현양상장애", "조현양상 장애", "정신분열형장애"], ch:"ㅈㅎㅇㅅㅈㅇ", ph:"최소 1개월 이상 ~ 6개월 미만", ex:"증상은 조현병과 같으나 기간이 1~6개월 미만인 경우입니다." },
      { c:"제3장 조현병 스펙트럼", q:"환청이나 언어 와해 등 조현병 활성기 증상 없이, 현실에서 일어날 법한 기괴하지 않은 체계적인 망상만이 최소 1개월 이상 지속되는 장애는?", a:"망상장애", s:["망상장애", "망상 장애"], ch:"ㅁㅅㅈㅇ", ph:"기괴하지 않은 망상만 최소 1개월 이상", ex:"다른 정신병적 증상 없이 체계적인 망상만 1개월 이상 지속됩니다." },
      { c:"제3장 조현병 스펙트럼", q:"별다른 전조증상 없이 비정신병적 상태에서 정신병적 상태로의 변화가 2주 이내에 급작스럽게 발생하며, 1일 이상 1개월 미만 지속 후 병전 기능으로 완전 회복되는 장애는?", a:"단기정신병적장애", s:["단기정신병적장애", "단기 정신병적 장애", "단기정신병장애"], ch:"ㄷㄱㅈㅅㅂㅈㅈㅇ", ph:"최소 1일 이상 최대 1개월 미만 (병전 기능 완전 회복)", ex:"1개월 이내에 지속되다가 완전히 병전 기능으로 회복됩니다." },

      // 4장
      { c:"제4장 기분관련장애", q:"우울한 기분 또는 흥미/즐거움의 상실 중 하나를 반드시 포함하여, 5가지 이상의 증상이 연속 2주 이상 지속되며 일상 기능을 저해하는 질환은?", a:"주요우울장애", s:["주요우울장애", "주요 우울장애", "우울증", "mdd"], ch:"ㅈㅇㅇㅇㅈㅇ", ph:"연속 2주 이상 5가지 증상 지속 (우울 or 흥미상실 필수)", ex:"우울 기분이나 흥미 상실을 포함해 2주 이상 지속될 때 진단됩니다." },
      { c:"제4장 기분관련장애", q:"적어도 2년 동안(아동·청소년 1년) 우울한 날이 없는 날보다 더 많으며, 식욕/수면/피로 등 부수 증상이 연속 2개월 이상 사라진 적이 없는 만성 우울 상태는?", a:"지속성 우울장애", s:["지속성 우울장애", "지속성우울장애", "기분저하증"], ch:"ㅈㅅㅅ ㅇㅇㅈㅇ", ph:"성인 최소 2년 이상, 2개월 이상 호전 없음", ex:"성인 기준 최소 2년간 우울감이 만성적으로 지속되는 질환입니다." },
      { c:"제4장 기분관련장애", q:"아동기 양극성장애 과잉진단 방지를 위해 신설되었으며, 주 3회 이상의 비정상적 분노 발작(폭언/공격성)과 발작 사이의 만성 과민성을 보이는 장애는?", a:"파괴적 기분조절부전장애", s:["파괴적 기분조절부전장애", "파괴적기분조절부전장애", "dmdd"], ch:"ㅍㄱㅈ ㄱㅂㅈㅈㅂㅈㅈㅇ", ph:"주 3회 이상 분노 발작 + 만성 과민성 (만 6~18세)", ex:"만 6~18세 아동 청소년에게 주 3회 이상 분노 발작이 나타납니다." },
      { c:"제4장 기분관련장애", q:"대부분의 월경 주기에서 월경 시작 약 1주 전부터 기분 불안정, 과민성, 분노, 신체 부종 등이 시작되어 월경 시작 수일 내 호전되고 끝난 후 사라지는 장애는?", a:"월경전 불쾌감장애", s:["월경전 불쾌감장애", "월경전 불쾌장애", "월경전불쾌감장애", "pmdd"], ch:"ㅇㄱㅈ ㅂㅋㄱㅈㅇ", ph:"월경 1주 전 발현 후 월경 직후 소실", ex:"월경 주기와 연동되어 일상 기능을 유의하게 저해합니다." },
      { c:"제4장 기분관련장애", q:"우울 삽화 유무와 무관하게, 일상 기능 붕괴나 입원이 필요한 심각한 조증 삽화(최소 1주일 지속)가 평생 1회 이상 발생했을 때 진단되는 장애는?", a:"I형 양극성장애", s:["I형 양극성장애", "1형 양극성장애", "양극성장애 1형", "양극성 장애 1형"], ch:"1ㅎ ㅇㄱㅅㅈㅇ", ph:"조증 삽화 최소 1주일 이상 (또는 입원 필요)", ex:"조증 삽화가 1회라도 발생하면 우울증 유무와 무관하게 진단됩니다." },
      { c:"제4장 기분관련장애", q:"평생 조증 삽화는 겪지 않았으나, 가벼운 경조증 삽화(최소 4일 지속)와 심각한 주요우울 삽화가 번갈아 반복되는 기분장애는?", a:"II형 양극성장애", s:["II형 양극성장애", "2형 양극성장애", "양극성장애 2형", "양극성 장애 2형"], ch:"2ㅎ ㅇㄱㅅㅈㅇ", ph:"경조증 삽화(최소 4일) + 주요우울 삽화 (조증 없음)", ex:"조증 없이 경조증과 주요우울 삽화가 교대로 나타납니다." },
      { c:"제4장 기분관련장애", q:"적어도 2년 동안(소아·청소년 1년) 경조증 기준에 미치지 못하는 가벼운 경조증과 경미한 우울 기간이 절반 이상 혼재되어 지속되는 기분장애는?", a:"순환성 장애", s:["순환성 장애", "순환성장애", "순환기분장애"], ch:"ㅅㅎㅅ ㅈㅇ", ph:"최소 2년간 경미한 경조증/우울 혼재 (2개월 이상 호전 없음)", ex:"조증이나 주요우울 삽화 기준에 미치지 못하는 상태가 2년 이상 지속됩니다." },

      // 5장
      { c:"제5장 불안장애", q:"주요 애착 대상과의 분리에 대해 발달 수준을 벗어난 극심한 불안을 보이며 등교 거부, 악몽, 복통/두통 호소가 지속되는 장애는?", a:"분리불안장애", s:["분리불안장애", "분리 불안 장애"], ch:"ㅂㄹㅂㅇㅈㅇ", ph:"아동 최소 4주 이상, 성인 6개월 이상", ex:"애착 대상과의 분리에 대한 비정상적 공포로 등교 거부를 유발합니다." },
      { c:"제5장 불안장애", q:"친숙한 환경에서는 말을 유창하게 잘하지만, 말을 해야 하는 특정 상황(학교 등)에서 1개월 이상 일관되게 침묵하는 장애는?", a:"선택적 함구증", s:["선택적 함구증", "선택적함구증", "선택적 침묵증"], ch:"ㅅㅌㅈ ㅎㄱㅈ", ph:"특정 상황에서 최소 1개월 이상 침묵", ex:"언어 능력은 정상이나 특정 상황에서 일관되게 침묵합니다." },
      { c:"제5장 불안장애", q:"높은 곳, 뱀이나 거미, 피나 주사 맞기, 비행기 등 특정한 대상이나 상황에만 국한되어 극심한 공포와 즉각적인 회피 반응이 6개월 이상 지속되는 장애는?", a:"특정공포증", s:["특정공포증", "특정 공포증"], ch:"ㅌㅈㄱㅍㅈ", ph:"특정 대상 국한, 6개월 이상 능동적 회피", ex:"특정 대상이나 상황에 국한된 비합리적 공포증입니다." },
      { c:"제5장 불안장애", q:"대화나 낯선 사람과의 만남 등 타인에게 관찰되거나 부정적 평가(수치심, 당황)를 받을 수 있는 사회적 상황을 극심하게 두려워하고 회피하는 장애는?", a:"사회공포증", s:["사회공포증", "사회불안장애", "사회 공포증", "사회 불안 장애"], ch:"ㅅㅎㄱㅍㅈ", ph:"부정적 평가에 대한 공포 (6개월 이상 지속)", ex:"타인의 부정적 평가나 수치심을 당할 상황을 회피합니다." },
      { c:"제5장 불안장애", q:"예기치 못한 공황발작의 반복과 함께, 추가 발작에 대한 지속적인 걱정(예기불안) 또는 회피 행동이 1개월 이상 지속되는 장애는?", a:"공황장애", s:["공황장애", "공황 장애"], ch:"ㄱㅎㅈㅇ", ph:"공황발작 후 1개월 이상 예기불안/회피 지속", ex:"발작 후 1개월 이상의 예기불안이나 행동 변화가 핵심입니다." },
      { c:"제5장 불안장애", q:"대중교통, 열린 공간, 밀폐 공간, 줄 서기, 집 밖 혼자 있기 등 5가지 상황 중 2가지 이상에서 탈출하기 어려울까 봐 두려워 지속 회피하는 장애는?", a:"광장공포증", s:["광장공포증", "광장 공포증"], ch:"ㄱㅈㄱㅍㅈ", ph:"5가지 장소 중 2가지 이상 회피 (6개월 이상)", ex:"곤란한 증상 시 탈출/도움 요청이 어렵다는 두려움으로 장소를 회피합니다." },
      { c:"제5장 불안장애", q:"특정 대상에 국한되지 않고 건강, 재정, 가족 안녕 등 일상생활의 수많은 사소한 일들에 대해 만성적으로 통제하기 힘든 부동성 불안과 걱정이 6개월 이상 지속되는 장애는?", a:"범불안장애", s:["범불안장애", "범 불안 장애", "gad"], ch:"ㅂㅂㅇㅈㅇ", ph:"최소 6개월 이상 만성적 과도한 걱정 지속", ex:"광범위한 일상에 대한 통제하기 힘든 걱정이 지속됩니다." },

      // 6장
      { c:"제6장 강박 및 관련 장애", q:"원치 않는 침투적 강박사고와 이를 중화하기 위해 엄격한 규칙대로 수행하는 반복적 강박행동(손 씻기, 확인 등)으로 하루 1시간 이상을 소모하는 장애는?", a:"강박장애", s:["강박장애", "강박증", "ocd"], ch:"ㄱㅂㅈㅇ", ph:"강박사고 + 강박행동 (하루 1시간 이상 소모)", ex:"침투적 사고와 이를 중화하기 위한 강박행동이 특징입니다." },
      { c:"제6장 강박 및 관련 장애", q:"타인이 볼 때는 미미하거나 없는 외모 결함에 집착하여 거울 확인, 과도한 치장, 비교하기 등 반복적 행동을 보이며 주관적 고통을 겪는 장애는?", a:"신체변형장애", s:["신체변형장애", "신체이형장애", "bdd"], ch:"ㅅㅊㅂㅎㅈㅇ", ph:"미미한 외모 결함에 대한 과도한 병적 몰두", ex:"자신의 외모 결함에 병적으로 몰두하고 반복 행동을 보입니다." },
      { c:"제6장 강박 및 관련 장애", q:"물건의 실제 가치와 상관없이 버리는 것에 고통을 느껴 버리지 못하고 끝없이 쌓아두어 정상적인 주거 공간 기능을 마비시키는 장애는?", a:"저장장애", s:["저장장애", "수집광"], ch:"ㅈㅈㅈㅇ", ph:"물건 가치 무관, 지속적으로 버리지 못함", ex:"물건을 버리지 못해 생활공간이 물건에 의해 잠식됩니다." },
      { c:"제6장 강박 및 관련 장애", q:"자신의 두피나 눈썹 등 신체에 난 털을 반복적으로 뽑아 뚜렷한 탈모로 이어지며, 멈추려는 시도에 반복 실패하는 강박관련장애는?", a:"털뽑기장애", s:["털뽑기장애", "발모광", "털뽑기 장애"], ch:"ㅌㅃㄱㅈㅇ", ph:"털을 반복적으로 뽑아 탈모 유발 (치료: HRT)", ex:"털을 반복적으로 뽑는 행동을 통제하지 못하는 질환입니다." },
      { c:"제6장 강박 및 관련 장애", q:"자신의 피부를 반복적으로 비비거나 비틀고 뜯어서 뚜렷한 피부 상처(병변)를 만들며 멈추려 하지만 조절하지 못하는 장애는?", a:"피부뜯기장애", s:["피부뜯기장애", "피부뜯기 장애", "피부박리장애"], ch:"ㅍㅂㄸㄱㅈㅇ", ph:"피부를 반복적으로 뜯어 병변 유발", ex:"피부를 뜯어 뚜렷한 피부 병변으로 이어지는 질환입니다." },

      // 7장 (중간고사 범위 끝)
      { c:"제7장 외상/스트레스 관련", q:"인식 가능한 일상 스트레스 시작 후 3개월 이내에 발병하였으나, 스트레스 요인이 끝난 후 6개월 이상은 지속되지 않는 장애는?", a:"적응장애", s:["적응장애", "적응 장애"], ch:"ㅈㅇㅈㅇ", ph:"스트레스 후 3개월 이내 발병, 종결 후 6개월 이내 종료", ex:"일상 스트레스 후 3개월 내 발병하고 6개월 내 종료됩니다." },
      { c:"제7장 외상/스트레스 관련", q:"극심한 외상 사건 노출 후 나타나는 침습, 해리, 회피, 과각성 반응이 사건 후 3일에서 1개월 이내로 종결되는 장애는?", a:"급성스트레스장애", s:["급성스트레스장애", "급성 스트레스 장애", "asd"], ch:"ㄱㅅㅅㅌㄹㅅㅈㅇ", ph:"외상 노출 후 3일 이상 ~ 1개월 이내", ex:"1개월 이내 종료되면 급성스트레스장애, 1개월 이상은 PTSD입니다." },
      { c:"제7장 외상/스트레스 관련", q:"실제적이거나 위협적인 죽음, 성폭력 등 극심한 외상 사건 노출 후 플래시백(해리 반응), 악몽, 회피, 과각성이 1개월 이상 지속되는 장애는?", a:"외상후 스트레스 장애", s:["외상후 스트레스 장애", "외상후스트레스장애", "ptsd"], ch:"ㅇㅅㅎ ㅅㅌㄹㅅ ㅈㅇ", ph:"외상 노출 후 1개월 이상 장기 지속", ex:"핵심 증상들이 1개월 이상 지속되어 기능 손상을 줍니다." },
      { c:"제7장 외상/스트레스 관련", q:"친밀한 대상의 사별 후 성인 기준 최소 12개월(소아 6개월) 이상 고인에 대한 극심한 갈망과 집착, 정체성 붕괴가 지속되는 장애는?", a:"지속성 비탄장애", s:["지속성 비탄장애", "지속적 비탄장애", "지속성비탄장애"], ch:"ㅈㅅㅅ ㅂㅌㅈㅇ", ph:"사별 후 성인 12개월 이상 지속", ex:"정상적 애도 기간을 넘어 극심한 고통이 지속됩니다." },
      { c:"제7장 외상/스트레스 관련", q:"극단적 방임으로 인해 고통스러운 상황에서도 성인 보호자에게 위안을 구하지 않고 정서적으로 심하게 위축·억제된 행동을 보이는 장애는?", a:"반응성 애착장애", s:["반응성 애착장애", "반응성애착장애", "rad"], ch:"ㅂㅇㅅ ㅇㅊㅈㅇ", ph:"발달연령 최소 9개월 이상 (5세 이전 발병, 위안 구하지 않음)", ex:"방임으로 인해 양육자에게 위안을 구하지 않는 억제형 애착 질환입니다." },
      { c:"제7장 외상/스트레스 관련", q:"방임 경험 이후 낯선 성인에 대한 조심성이나 경계심이 완전히 결여된 채 무분별하게 친근하게 접근하고 따라나서는 애착 장애는?", a:"탈억제성 사회적 유대감 장애", s:["탈억제성 사회적 유대감 장애", "탈억제성 사회관여 장애", "탈억제성사회적유대감장애", "dsed"], ch:"ㅌㅇㅈㅅ ㅅㅎㅈ ㅇㄷㄱ ㅈㅇ", ph:"발달연령 최소 9개월 이상 (낯선 사람 경계심 결여)", ex:"낯선 성인에 대한 조심성이 결여되어 무분별하게 다가갑니다." },
      { c:"제7장 8번 (중간고사 범위 끝)", q:"2개 이상의 구별되는 독립적인 성격 상태를 보이며, 성격이 교대될 때마다 일상적인 망각으로는 설명할 수 없는 기억 공백을 동반하는 해리장애는?", a:"해리성 정체감 장애", s:["해리성 정체감 장애", "해리성정체감장애", "다중인격장애", "did"], ch:"ㅎㄹㅅ ㅈㅊㄱ ㅈㅇ", ph:"2개 이상의 독립된 성격 상태 + 기억 공백 (구 다중인격)", ex:"중간고사 범위(7주차 8번)의 최종 장애로 구 다중인격장애입니다." }
    ];

    var rnd = 1, cur = [], idx = 0, sc = 0, tot = 0, ans = false, wl = [];
    function nml(t) { return (t||"").toString().toLowerCase().replace(/[\s\-_(),.'"\n\r\t]/g, "").trim(); }
    function shf(a) { var c=a.slice(); for(var i=c.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=c[i]; c[i]=c[j]; c[j]=t; } return c; }
    
    function ir(r) {
      rnd = r; idx = 0; sc = 0; ans = false; wl = [];
      cur = shf(POOL).slice(0, 10);
      document.getElementById("rb").innerText = "제 " + rnd + " 회차 / 총 10회차";
      document.getElementById("qsec").style.display = "block";
      document.getElementById("rsec").style.display = "none";
      rq();
    }

    function rq() {
      ans = false; var q = cur[idx];
      document.getElementById("pqt").innerText = "문제 " + (idx+1) + " / 10";
      document.getElementById("rst").innerText = "정답: " + sc + " / 10";
      document.getElementById("pf").style.width = ((idx+1)*10) + "%";
      document.getElementById("cb").innerText = q.c;
      document.getElementById("qt").innerText = q.q;
      document.getElementById("hb").style.display = "none";
      var i = document.getElementById("ans"); i.value=""; i.disabled=false;
      document.getElementById("fbc").style.display = "none";
    }

    function th(t) {
      var q = cur[idx], b = document.getElementById("hb");
      b.style.display = "block";
      b.innerHTML = (t==='c' ? "💡 <strong>초성 힌트:</strong> " + q.ch : "⏱ <strong>기간/핵심 단서:</strong> " + q.ph);
    }

    function sub() {
      if(ans) return;
      var i = document.getElementById("ans"), v = i.value.trim();
      if(!v) return;
      ans = true; i.disabled = true;
      var q = cur[idx], nv = nml(v);
      var ok = [q.a].concat(q.s).some(function(x){ return nml(x) === nv; });
      if(ok){ sc++; tot++; } else { wl.push({q:q.q, u:v, a:q.a, e:q.ex}); }
      
      var c = document.getElementById("fbc"), t = document.getElementById("ft"), d = document.getElementById("fd");
      c.style.display = "block";
      c.className = "fb " + (ok ? "fb-ok" : "fb-no");
      t.innerText = ok ? "🎉 정답입니다! 정확한 진단명입니다." : "💡 오답입니다. (작성 답안: " + v + ")";
      d.innerHTML = "<p><strong>표준 정답:</strong> " + q.a + "</p><p style='color:#64748b; margin-top:2px;'><strong>해설:</strong> " + q.ex + "</p>";
      document.getElementById("rst").innerText = "정답: " + sc + " / 10";
      document.getElementById("nb").innerText = (idx===9 ? "회차 성적 확인하기 📊" : "다음 문제 ➔");
    }

    document.getElementById("ans").addEventListener("keypress", function(e){ if(e.key==="Enter") sub(); });

    function nxt() { if(idx<9){ idx++; rq(); } else { sr(); } }

    function sr() {
      document.getElementById("qsec").style.display = "none";
      document.getElementById("rsec").style.display = "block";
      document.getElementById("fsc").innerText = sc + " / 10";
      var rate = Math.round((tot / (rnd * 10)) * 100);
      document.getElementById("cum").innerText = "누적 정답률: " + rate + "% (" + tot + " / " + (rnd * 10) + ")";
      var w = document.getElementById("wl"); w.innerHTML = "";
      if(wl.length === 0){
        w.innerHTML = "<p style='color:#059669; font-weight:bold; text-align:center;'>✨ 대단합니다! 이번 회차 10문항을 모두 맞히셨습니다!</p>";
      } else {
        var h = "<p style='font-weight:bold; color:#e11d48; margin-bottom:6px;'>⚠️ 이번 회차 오답 복습 ("+wl.length+"개):</p>";
        wl.forEach(function(m, k){
          h += "<div class='witem'><p><strong>" + (k+1) + ". " + m.q + "</strong></p><p style='color:#e11d48'>내 답안: " + m.u + " ➔ <strong style='color:#059669'>정답: " + m.a + "</strong></p><p style='color:#64748b; margin-top:2px;'>" + m.e + "</p></div>";
        });
        w.innerHTML = h;
      }
      var b = document.getElementById("nrb");
      if(rnd >= 10){
        b.innerText = "🏆 10회차 완주! 처음부터 다시 풀기";
        b.onclick = function(){ tot = 0; ir(1); };
      } else {
        b.innerText = "다음 랜덤 10문제 (제 " + (rnd+1) + "회차) ➔";
        b.onclick = function(){ ir(rnd+1); };
      }
    }

    function nr() { ir(rnd+1); }

    ir(1);
  </script>
</body>
</html>
