function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = questions.map((q, idx) => `
    <div class="card" id="card-${idx}">
      <div class="card-header">
        <span class="badge">${q.chapter}</span>
        <span class="q-num">문항 ${idx + 1} / 50</span>
      </div>
      <div class="q-text">${idx + 1}. ${q.title}</div>
      <div class="q-prompt">${q.prompt}</div>
      <textarea placeholder="시험 답안지에 작성하듯 구체적인 전문 용어와 이론적 근거를 바탕으로 답안을 작성해보세요..."></textarea>
      <button class="btn-toggle" onclick="toggleAnswer(this)">모범답안 및 채점 기준 확인</button>
      <div class="answer-box">
        <div class="answer-header">
          <h4>[교수 강의안 기반 표준 모범답안]</h4>
          <span class="source-tag">출처: ${q.src}</span>
        </div>
        <p>${q.ans}</p>
        <div class="criteria">
          <strong>핵심 채점 기준:</strong> ${q.crit}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleAnswer(btn) {
  const box = btn.nextElementSibling;
  if (box.style.display === "block") {
    box.style.display = "none";
    btn.textContent = "모범답안 및 채점 기준 확인";
    btn.style.background = "var(--primary)";
  } else {
    box.style.display = "block";
    btn.textContent = "답안 접기";
    btn.style.background = "#059669";
  }
}

function expandAll() {
  document.querySelectorAll('.answer-box').forEach(b => b.style.display = "block");
  document.querySelectorAll('.btn-toggle').forEach(b => {
    b.textContent = "답안 접기";
    b.style.background = "#059669";
  });
}

function collapseAll() {
  document.querySelectorAll('.answer-box').forEach(b => b.style.display = "none");
  document.querySelectorAll('.btn-toggle').forEach(b => {
    b.textContent = "모범답안 및 채점 기준 확인";
    b.style.background = "var(--primary)";
  });
}

renderQuiz();
</script>
