  <style>

  <script>
    var POOL = [
      // 1장 브루샤 정의
      {
        c: "제1장 음악치료의 정의와 정체성",
        q: "• <strong>학술적 원문 정의:</strong> 브루샤(Bruscia, 2014)는 저서 『Defining Music Therapy』에서 음악치료를 다음과 같이 정의함:\n" +
           "\"음악치료는 치료사가 다양한 음악적 경험의 요소들과 그 과정에서 형성되는 관계를 변화의 원동력으로 활용하여, 내담자가 자신의 건강을 최적화하도록 돕는 <strong>이 과정</strong>이다.\"\n" +
           "• <strong>임상적 의의:</strong> 일방적으로 음악을 들려주거나 제공하는 수동적 과정이 아니며, 치료사와 내담자 모두가 음악 경험을 매개로 서로의 반응을 끊임없이 되돌아보고 점검하며 치료적 변화를 이끌어내는 능동적·협력적 이중 과정을 의미함.\n\n" +
           "브루샤가 음악치료의 가장 핵심적인 속성으로 규정한 이 용어는?",
        a: "성찰적 과정",
        s: ["성찰적 과정", "성찰적과정", "reflexive process"],
        ch: "ㅅㅊㅈ ㄱㅈ",
        ph: "치료사와 내담자가 상호작용 속에서 서로를 되돌아보는 이중적 과정",
        ex: `
          <div class="detail-card">
            <span class="detail-title">📖 브루샤(Bruscia, 2014)의 원문 정의 및 의의 [교안 7, 138-139p]</span>
            • <strong>정의:</strong> 치료사가 다양한 음악적 경험의 요소들과 관계를 변화의 원동력으로 삼아 내담자가 건강을 최적화하도록 돕는 <u>성찰적 과정(Reflexive Process)</u>[cite: 7, 138].<br>
            • <strong>의의 1 (상호작용 속 개입):</strong> 단순 음악 제공에 그치지 않고 치료사-내담자 상호작용 속 개입이 치료적 변화를 유도함[cite: 7].<br>
            • <strong>의의 2 (성찰적 협력):</strong> 치료사와 내담자 모두가 음악 경험을 통해 끊임없이 자신과 서로의 반응을 되돌아보는 이중적 과정임[cite: 7, 139].
          </div>
        `
      },
      // 4장 3가지 심리학적 이론
      {
        c: "제4장 음악과 인간 (2) 심리정서적 기능",
        q: "• <strong>교안 원문 핵심:</strong> 같은 음악을 듣고도 사람마다, 상황마다 서로 다른 정서를 느끼는 이유를 설명하는 <strong>'세 가지 심리학적 이론'</strong>:\n" +
           "1. <strong>관련성 이론 (Juslin & Västfjäll, 2008):</strong> 개인의 과거 기억 및 경험(삽화적 기억, 평가적 조건형성)과 결합되어 정서가 유발됨 (예: 자장가, 졸업식 노래).\n" +
           "2. <strong>기대 이론 (Meyer, 1956):</strong> 음악 구조 자체에 대한 무의식적 예측, 그리고 그 예측의 충족이나 지연(기만 종지 등)에서 긴장과 해소가 발생함.\n" +
           "3. <strong>이 이론 (Berlyne, 1971):</strong> 새로움, 복잡성 등의 자극이 유발하는 각성 수준과 쾌감 사이의 관계가 <strong>역U자형 곡선(분트 곡선)</strong>을 그리며, 너무 단순(지루함)하거나 너무 복잡(불쾌감)하지 않은 중간 수준에서 쾌감이 최대화됨 (예: 바흐의 푸가).\n\n" +
           "각성 수준과 쾌감의 역U자형 균형을 설명하는 세 번째 이론의 명칭은?",
        a: "최적 복잡성 이론",
        s: ["최적 복잡성 이론", "최적복잡성이론", "최적 복잡성", "berlyne"],
        ch: "ㅊㅈ ㅂㅈㅅ ㅇㄹ",
        ph: "각성 수준과 쾌감의 역U자형 관계 (분트 곡선), Berlyne(1971)",
        ex: `
          <div class="detail-card">
            <span class="detail-title">📋 정서 유발 및 조절의 세 가지 심리학적 이론 비교 [교안 57, 222-223p]</span>
            • <strong>관련성 이론:</strong> '이 사람에게 왜 특별한가' (개인적·경험적 층위)[cite: 57, 223]<br>
            • <strong>기대 이론:</strong> '음악 구조가 왜 긴장과 이완을 만드는가' (음악 내적 층위, 기만종지)[cite: 57, 222, 223]<br>
            • <strong>최적 복잡성 이론:</strong> '이 정도 자극이 왜 쾌적한가' (각성 수준 층위, 분트 곡선)[cite: 57, 222, 223]<br>
            <em>$\rightarrow$ 세 이론은 대립하는 것이 아니라 서로 다른 층위를 설명하며 임상에서 동시에 작동함[cite: 57, 223].</em>
          </div>
        `
      },
      // 4장 3가지 구조적 요소
      {
        c: "제4장 음악과 인간 (2) 심리정서적 기능",
        q: "• <strong>교안 원문 핵심:</strong> 음악이 인간의 정서를 조율하고 조절하는 핵심 통로가 되는 <strong>'세 가지 구조적 요소'</strong> [표 4-1]:\n" +
           "1. <strong>멜로디:</strong> 음높이의 상승과 하강을 통해 기대와 긴장을 조율함 (상승 선율은 긴장 고조, 하강 선율은 이완/안정).\n" +
           "2. <strong>화성:</strong> 협화음과 불협화음의 대비를 통해 감정적 만족과 긴장의 해소를 조절함 (불협화음이 협화음으로 해결될 때 카타르시스 강화).\n" +
           "3. <strong>이 요소:</strong> 음의 길고 짧음, 강약이 반복되는 패턴으로, 심장박동이나 호흡과 같은 신체의 생리적 리듬과 직접 동조(Entrainment)하여 안정(규칙적 패턴, 행진곡) 또는 각성과 긴박감(불규칙 패턴, 당김음)을 유도함.\n\n" +
           "신체 생리적 리듬과 직접 상호작용하는 이 구조적 요소는?",
        a: "리듬",
        s: ["리듬", "rhythm"],
        ch: "ㄹㄷ",
        ph: "생리적 리듬(심박·호흡)과 직접 동조(Entrainment)하는 구조적 요소",
        ex: `
          <div class="detail-card">
            <span class="detail-title">📋 음악의 세 가지 구조적 요소와 정서적 작용 [교안 55-56, 220-221p]</span>
            • <strong>멜로디:</strong> 선율의 상승·하강으로 기대와 긴장 조율 (자장가, 후렴구 도약)[cite: 55, 56, 220, 221]<br>
            • <strong>리듬:</strong> 신체 리듬과 직접 동조되어 안정 또는 각성 유도 (행진곡, 당김음)[cite: 55, 56, 220, 221]<br>
            • <strong>화성:</strong> 협화·불협화의 대비로 감정적 만족과 해소 조절 (기만종지 해결)[cite: 55, 56, 221]
          </div>
        `
      },
      // 3장 변인의 층위
      {
        c: "제3장 음악과 인간 (1) 신체생리적 기능",
        q: "• <strong>교안 표 3-2 원문:</strong> 공기의 압력 진동인 음파에서 출발하여 대뇌 청각피질에서 의미 있는 음악으로 조직화되기까지 거치는 <strong>'변인의 세 가지 층위'</strong>:\n" +
           "1. <strong>물리적 변인:</strong> 진동, 주파수(Hz), 강도/진폭, 시간, 파동 등 외부 음파 자체의 물리량.\n" +
           "2. <strong>감각적 변인:</strong> 귀의 감각기관이 감지하는 소리, 고저, 강약, 장단, 질감.\n" +
           "3. <strong>이 층위 (변인):</strong> 뇌에서 통합·해석되어 비로소 음악적 실체로 인지되는 단계로, 음, 음고(Pitch), 세기(Loudness), 음가(Duration), 음색(Timbre)으로 구성됨.\n\n" +
           "교안 필기에서 \"이 단계로 가게 되면 비로소 음악적인 인지가 된다\"고 강조한 변인의 층위는?",
        a: "지각적 변인",
        s: ["지각적 변인", "지각적변인"],
        ch: "ㅈㄱㅈ ㅂㅇ",
        ph: "음, 음고, 세기, 음가, 음색으로 구성되어 음악으로 완성되는 뇌의 단계",
        ex: `
          <div class="detail-card">
            <span class="detail-title">📋 소리 $\rightarrow$ 음악, 변인의 층위 [교안 44, 197p, 표 3-2]</span>
            • <strong>물리적 변인:</strong> 진동, 주파수, 강도, 시간, 파동[cite: 44, 197]<br>
            • <strong>감각적 변인:</strong> 소리, 고저, 강약, 장단, 질감[cite: 44, 197]<br>
            • <strong>지각적 변인:</strong> 음, 음고(Pitch), 세기(Loudness), 음가(Duration), 음색(Timbre)[cite: 44, 197]<br>
            <em>정신물리학: 물리량(진폭 등)과 지각량(세기 등)은 1:1로 비례하지 않음[cite: 43, 196].</em>
          </div>
        `
      },
      // 5장 치료계획 수립 중요성
      {
        c: "제5장 음악치료 과정",
        q: "• <strong>교안 슬라이드 원문:</strong> 「1) 치료계획 수립의 개념과 중요성: 치료계획 수립, 왜 중요한가」\n" +

      if(ans) return;
      var i = document.getElementById("ans"), v = i.value.trim();
      if(!v) return;
      ans = true; i.disabled = true;
      var q = cur[idx], nv = nml(v);
      var ok = [q.a].concat(q.s).some(function(x){ return nml(x) === nv; });
      if(ok){ sc++; tot++; } else { wl.push({q:q.q, u:v, a:q.a, e:q.ex}); }
      
      var c = document.getElementById("fbc"), t = document.getElementById("ft"), d = document.getElementById("fd");
      c.style.display = "block";

      document.getElementById("nb").focus();
    }

    document.getElementById("ans").addEventListener("keypress", function(e){ if(e.key==="Enter") sub(); });

    function nxt() { if(idx<9){ idx++; rq(); } else { sr(); } }

    function sr() {
      document.getElementById("qsec").style.display = "none";
      document.getElementById("rsec").style.display = "block";
      document.getElementById("fsc").innerText = sc + " / 10";
      var rate = Math.round((tot / (rnd * 10)) * 100);

        w.innerHTML = "<p style='color:#059669; font-weight:bold; text-align:center;'>✨ 대단합니다! 이번 회차 10문항을 모두 맞히셨습니다!</p>";
