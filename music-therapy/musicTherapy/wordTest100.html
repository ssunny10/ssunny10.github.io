<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#222;--mu:#666;--bd:#ddd;--ac:#3b6fd4;--ok:#1e8e4e;--no:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--card:#222226;--tx:#eee;--mu:#aaa;--bd:#3a3a40;--ac:#7aa2f7;--ok:#4cc38a;--no:#ff7b72}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:2}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:rgba(30,142,78,.15)}
.opt.no{border-color:var(--no);background:rgba(192,57,43,.15)}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}

</style></head><body><main>
<h1>🎵 음악치료학 중간고사 대비 퀴즈</h1>
<p class="tag">쪽수(p.)는 업로드한 강의안 PDF의 페이지 번호입니다. 객관식·빈칸은 자동 채점, 주관식은 모범답안을 보고 직접 채점합니다.</p>
<div class="bar" id="bar"></div><div id="list"></div>
<script>
const Q=[
{t:'mc',q:'브루샤(Bruscia)는 음악치료를 어떤 과정으로 정의했는가?',o:['성찰적 과정(Reflexive Process)','교정적 과정','일방향적 처방 과정','진단 중심 과정'],a:0,e:'치료사가 음악 경험과 그 안에서 형성되는 관계를 변화의 원동력으로 활용해 내담자의 건강을 최적화하도록 돕는 "성찰적 과정"입니다. 치료사·내담자 모두 서로를 되돌아보는 이중적 과정이라는 점이 핵심입니다.',p:'p.4, p.25'},
{t:'mc',q:'음악치료의 4대 핵심 요소에 해당하지 않는 것은?',o:['음악 경험','음악치료사','내담자의 연주 실력','체계적 치료과정'],a:2,e:'4대 요소는 음악 경험, 음악치료사, 음악을 통한 변화, 체계적 치료과정입니다. 연주 실력 자체가 아니라 그 경험을 통한 비음악적 행동의 변화가 목표입니다.',p:'p.8, p.10, p.28'},
{t:'mc',q:'뇌졸중 환자의 보행·언어 능력을 이전 수준으로 되찾게 하는 변화는 유지·향상·복원·발달 중 무엇인가?',o:['유지','향상','복원','발달'],a:2,e:'복원은 손상된 기능을 이전 수준으로 회복하는 것입니다. 유지(치매 환자의 인지 기능 관리), 향상(잠재 능력 최대화), 발달(새로운 기능 형성)과 구분하세요.',p:'p.11, p.29'},
{t:'mc',q:'내담자와 사적 친분을 맺거나 금전 거래·선물을 주고받는 것을 막는 윤리 원칙은?',o:['비밀보장','사전동의','전문적 경계 및 이중관계 방지','공정성 및 다양성 존중'],a:2,e:'치료 외적 영역으로 관계를 넓히는 이중관계(사적 친분, 금전 거래, 선물 교환)를 방지해 치료적 관계의 객관성을 지키는 원칙입니다.',p:'p.14, p.31'},
{t:'mc',q:'국내 최초의 음악치료대학원이 개설된 대학은? (1997년)',o:['명지대학교','숙명여자대학교','이화여자대학교','연세대학교'],a:1,e:'1996년 한국음악치료학회 창립 → 1997년 2월 숙명여대 음악치료대학원(국내 최초), 같은 해 이화여대, 1998년 명지대 석사과정 순입니다.',p:'p.39'},
{t:'mc',q:'인본주의 음악치료에서 치료사의 태도로 가장 알맞은 것은?',o:['지시적 전문가','구조화된 코치','무의식 해석자','비지시적 촉진자'],a:3,e:'인본주의 접근은 인간이 스스로 성장할 잠재력을 지닌다고 보기 때문에 치료사가 비지시적(Non-directive) 촉진자로 물러섭니다. 인지행동·생의학·신경학 접근은 지시적입니다.',p:'p.42, p.46, p.53'},
{t:'mc',q:'신경학적 음악치료(NMT)를 개발한 사람은?',o:['줄리엣 알빈','마이클 타우트','메리 프리슬리','헬렌 보니'],a:1,e:'마이클 타우트가 1980~90년대 신경과학 발전 속에서 NMT를 개발했고, 저서 「Rhythm, Music, and the Brain」(2005)이 있습니다.',p:'p.52, p.225'},
{t:'mc',q:'소리가 청각피질에 이르는 경로의 올바른 순서는?',o:['외이→내이→중이→청신경→청각피질','외이→중이→내이→청신경→청각피질','중이→외이→내이→청각피질→청신경','외이→중이→청신경→내이→청각피질'],a:1,e:'외이 → 중이 → 내이(와우, 유모세포가 진동을 전기 신호로 변환) → 청신경 → 청각피질의 다섯 단계입니다.',p:'p.73~74'},
{t:'mc',q:'음악을 들을 때 느끼는 즐거움·쾌감(보상)과 가장 관련이 깊은 뇌 부위는?',o:['해마','측좌핵','소뇌','뇌량'],a:1,e:'측좌핵(Nucleus Accumbens)은 쾌감·보상, 해마는 기억(자전적 기억 회상)과 관련됩니다.',p:'p.76, p.82'},
{t:'mc',q:'음악치료 진단평가의 다섯 가지 방법 중 음악치료의 고유한 정체성이 가장 뚜렷하게 드러나는 도구는?',o:['인터뷰','설문지·체크리스트','관찰법','심리검사 병행'],a:2,e:'관찰법은 음악 활동 중 행동·반응을 체계적으로 기록하는 방법으로, 구조화·비구조화 관찰이 함께 쓰입니다.',p:'p.147~148'},
{t:'mc',q:'심상음악치료(BMGIM)의 적용 단계 순서로 옳은 것은?',o:['이완 유도 → 프렐류드 → 심상 유도 → 포스트루드','프렐류드 → 이완 유도 → 음악 감상 및 심상 유도 → 포스트루드','프렐류드 → 심상 유도 → 이완 유도 → 포스트루드','포스트루드 → 프렐류드 → 이완 유도 → 심상 유도'],a:1,e:'프렐류드(주제·목표 설정) → 이완 유도 → 음악 감상 및 심상 유도 → 포스트루드(경험 통합, 만다라 그리기 등)의 4단계입니다.',p:'p.221'},
{t:'mc',q:'창조적 음악치료(NRMT)를 시작한 두 사람과 핵심 개념이 바르게 짝지어진 것은?',o:['프리슬리·와들 / 진짜 목소리','노르도프·로빈스 / 음악 아동(Music Child)','오스틴·보니 / 보컬 홀딩','타우트·슐라우그 / RAS'],a:1,e:'1950년대 말 작곡가 폴 노르도프와 특수교사 클라이브 로빈스가 시작했고, 모든 인간 안의 창조적 자아인 "음악 아동"을 즉흥연주로 깨웁니다.',p:'p.218, p.230'},
{t:'sa',q:'[주관식] 엄밀한 의미의 음악치료가 성립하기 위한 3가지 조건을 쓰시오.',a:'① 내담자 필요에 대한 과학적 진단 ② 명확한 치료 목적과 체계적 계획 ③ 치료사–내담자 간의 치료적 관계',e:'세 조건은 개별로는 다른 분야에도 있지만, "음악적 경험"이라는 매체 안에서 동시에 충족될 때 음악치료의 충분조건이 됩니다. 하나라도 결여되면 엄밀한 의미의 음악치료로 보기 어렵습니다.',p:'p.3, p.24'},
{t:'sa',q:'[주관식] 음악을 통한 변화 네 가지를 쓰고, 각각의 예를 하나씩 드시오.',a:'유지(치매 환자의 인지 기능 유지) / 향상(보행 가능한 내담자의 걸음 속도·균형 향상) / 복원(뇌졸중 환자의 보행·언어 회복) / 발달(발달지연 아동의 언어·사회성 발달)',e:'네 가지는 배타적이지 않고 내담자 상태와 목표에 따라 한 치료 안에서 복합적으로 나타날 수 있습니다.',p:'p.10~11'},
{t:'sa',q:'[주관식] 음악치료 윤리의 6대 원칙을 모두 쓰시오.',a:'내담자 복지 및 안전 최우선 / 전문성 및 역량 유지 / 비밀보장 / 사전동의 / 공정성 및 다양성 존중 / 전문적 경계 및 이중관계 방지',e:'내담자 복지·안전 최우선이 다른 모든 원칙의 근간이 되는 최상위 원칙입니다(AMTA, 2019). 윤리적 갈등 대처 3영역: 내담자와의 관계 관리 / 치료사 스스로의 전문성·성찰 / 외부 전문가·기관과의 협력.',p:'p.14, p.30~31'},
{t:'sa',q:'[주관식] 음악치료 접근법의 다섯 갈래를 쓰고, 치료사의 태도가 지시적인 것과 비지시적인 것을 구분하시오.',a:'인지행동·인본주의·정신역동·생의학·신경학적 접근. 지시적: 인지행동·생의학·신경학 / 비지시적: 인본주의 / 정신역동은 그 중간(해석과 통찰을 제공하되 내담자의 무의식적 표현을 따라감)',e:'차이는 스타일이 아니라 인간을 어떻게 보는가라는 철학적 전제에서 나옵니다. 좌표는 지시성(지시↔비지시) × 개입 대상(심리↔생리)입니다.',p:'p.41~42, p.53'},
{t:'sa',q:'[주관식] 빠른 템포와 느린 템포의 음악이 자율신경계에 미치는 영향을 비교하시오.',a:'빠른 템포·강한 박자·큰 음량 → 교감신경 자극 → 심박수·혈압 상승, 각성, 집중력 향상. 느리고 부드러운 음악 → 부교감신경 자극 → 심박수 감소, 근육 이완, 긴장 완화, 안정감.',e:'이 원리는 스트레스 관리, 수면 유도, 불안 완화, 운동 재활 등에 활용됩니다.',p:'p.50, p.77'},
{t:'sa',q:'[주관식] 진단평가의 다섯 가지 주요 방법을 쓰시오.',a:'관찰법 / 인터뷰 / 설문지·체크리스트 / 기존 자료 검토 / 심리검사 병행',e:'방법마다 오차와 한계가 달라서 여러 가지를 함께 씁니다. 심리검사는 음악치료사가 직접 하기보다 임상심리사의 결과를 참고 자료로 활용하는 것이 일반적입니다.',p:'p.147~148'},
{t:'sa',q:'[주관식] 치료적 음악활동의 3단계 흐름과 설계 원리 3가지를 쓰시오.',a:'흐름: 도입(수용적 활동으로 긴장 완화) → 전개(능동적 활동으로 집중 개입) → 마무리(감정 공유·이완·피드백). 원리: 일과성(Routineness), 반복성(Repetition), 점진적 구조화(Scaffolding)',e:'실제 임상에서는 순서가 유동적일 수 있습니다. 점진적 구조화는 지원을 점차 줄여 나가는 스캐폴딩 개념에 뿌리를 둡니다.',p:'p.157~158'},
{t:'sa',q:'[주관식] 신경학적 음악치료(NMT)의 대표 기법 세 가지와 각각의 대상 영역을 쓰시오.',a:'RAS(리듬적 청각 자극) – 감각운동·보행 / MIT(멜로디억양치료) – 언어·실어증 / TIMP(치료적 악기연주) – 인지 및 상지운동',e:'NMT는 정서보다 운동·언어·인지 기능 회복을 우선하는 재활 중심 접근이며, 정량화·표준화된 20여 개 기법을 보유합니다.',p:'p.226, p.231'},
{t:'sa',q:'[주관식] 가창활동의 네 가지 세부 기법을 구조화된 것부터 자유로운 순서로 쓰시오.',a:'노래부르기 → 가사분석 → 즉흥 보컬 연주 → 노래창작',e:'뒤로 갈수록 내담자에게 요구되는 자율성과 개방성이 커집니다. 다만 고정된 규칙이 아니라 경향입니다.',p:'p.185, p.188'},
{t:'fb',q:'[빈칸] 한국음악치료학회는 ( )년 11월에 창립되었다.',a:['1996'],e:'국내 최초의 음악치료 학술 단체입니다. 미국보다 약 40여 년 늦은 1990년대 중후반에 제도화가 본격화되었습니다.',p:'p.39'},
{t:'fb',q:'[빈칸] 청자가 다음 음과 화성을 무의식적으로 예측하며 듣는다고 본 기대 이론은 ( )(1956)이 제시했다.',a:['마이어','메이어','Meyer','meyer'],e:'예측이 실현되면 안정감, 지연되거나 어긋나면 긴장을 느낍니다(예: 기만 종지). 최적 복잡성 이론은 Berlyne(1971)입니다.',p:'p.106'},
{t:'fb',q:'[빈칸] 최적 복잡성 이론에서 자극의 각성 수준과 쾌감의 관계는 ( )자형 곡선을 그린다.',a:['역U','역u','역 U','역 u'],e:'너무 단순하지도 너무 복잡하지도 않은 적당한 자극일 때 쾌감이 가장 큽니다.',p:'p.106, p.120'},
{t:'fb',q:'[빈칸] RAS는 환자의 선호 박자에 맞춘 리듬 신호를 제공한 뒤 박자를 점진적으로 ( )% 증감시킨다. (숫자 범위로 입력)',a:['5~10','5-10','5∼10'],e:'RAS는 보행처럼 신체에 내재된 리듬적 움직임의 속도와 보폭을 동조시킵니다.',p:'p.191'},
{t:'fb',q:'[빈칸] 수면 유도에는 분당 ( )비트 내외의 느린 템포 음악이 활용된다. (숫자 범위로 입력)',a:['60~80','60-80','60∼80'],e:'세로토닌 분비 → 멜라토닌 분비를 유도하고 심박수·호흡을 안정시키며 코르티솔 수치를 낮춥니다.',p:'p.78'},
{t:'fb',q:'[빈칸] 심상음악치료(BMGIM)는 바이올리니스트 ( )가 1970년대에 개발했다.',a:['헬렌 보니','보니','Helen Bonny','Bonny'],e:'융의 상징·원형 이론, 초월심리학 등의 영향을 받았습니다. 치료사는 해석자가 아니라 내면 여행의 동반자(Guide)입니다.',p:'p.220'},
{t:'fb',q:'[빈칸] 성악심리치료(VPT)는 ( )가 1990년대 중반 개발했으며, 대상관계이론에 기반한다.',a:['다이앤 오스틴','오스틴','Diane Austin','Austin'],e:'핵심 개념은 진짜 목소리(Authentic Voice), 즉흥 보컬 표현, 보컬 홀딩, 자유연상 가창입니다.',p:'p.227~228'},
{t:'fb',q:'[빈칸] 매슬로는 인간의 욕구를 생리적 욕구부터 자아실현의 욕구까지 ( )단계로 분류했다.',a:['5','다섯','5단계','다섯 단계'],e:'20세기 중반 칼 로저스와 매슬로(1943)가 인본주의 철학을 심리학에 본격 적용했습니다.',p:'p.45'},
{t:'fb',q:'[빈칸] 치료 계획을 세울 때는 먼저 ( )목표를 설정한 뒤, 이를 달성하기 위한 단기목표를 역으로 도출하는 방식이 흔히 쓰인다.',a:['장기'],e:'장기목표는 치료 전반에 걸쳐 궁극적으로 도달할 변화이고, 단기목표는 그에 이르는 세부적·실행 가능한 음악 행동 목표입니다.',p:'p.153'},
{t:'mc',q:'메리엄(Merriam, 1964)이 정리한 음악의 사회문화적 기능은 이 강의안에서 몇 가지로 제시되는가?',o:['7가지','8가지','9가지','10가지'],a:2,e:'원래 열 가지 중 "사회적 규범 강화"와 "사회 기관 통합"을 하나로 묶어 아홉 가지로 정리합니다.',p:'p.114, p.118'},
{t:'mc',q:'음악의 정서 효과를 "예측-충족(또는 지연)"이라는 시간적 구조로 설명하는 이론은?',o:['관련성 이론','기대 이론','최적 복잡성 이론','감정 전이 이론'],a:1,e:'기대 이론(Meyer)입니다. 관련성 이론은 개인의 기억·경험, 최적 복잡성 이론은 각성 수준과 쾌감의 역U자 관계를 설명합니다.',p:'p.106~107'},
{t:'mc',q:'카타르시스 이론에서 내담자의 현재 정서에 맞는 음악으로 시작해 점차 원하는 방향으로 이끄는 임상 원리는?',o:['동질원리(Iso-principle)','역전이','점진적 구조화','체계적 둔감화'],a:0,e:'감정과 반대되는 음악을 강요하기보다 현재 정서와 부합하는 음악에서 출발하는 동질원리가 임상적으로 효과적입니다.',p:'p.109'},
{t:'mc',q:'진단평가에서 수집한 정보를 하나의 임상적 이해로 통합·해석해 치료계획으로 연결하는 과정은?',o:['기초선 설정','사례개념화','치료 종결','다학제적 접근'],a:1,e:'사례개념화(Case Conceptualization)입니다. 실제 서식에서는 진단평가서의 "강점과 필요" 항목 등으로 나뉘어 흡수되는 경우가 많습니다.',p:'p.150~151, p.164'},
{t:'mc',q:'치료 목표의 네 가지 영역에 해당하지 않는 것은?',o:['인지적 영역','신체적 영역','경제적 영역','사회적 영역'],a:2,e:'치료 목표 영역은 인지·신체·정서·사회의 네 가지입니다. 하나의 활동이 여러 영역에 동시에 걸치는 경우가 대부분입니다.',p:'p.153, p.155'},
{t:'mc',q:'연주활동의 네 가지 유형에 해당하지 않는 것은?',o:['즉흥연주','구조적 연주','가사분석','재창조 연주'],a:2,e:'연주활동은 즉흥연주·구조적 연주·리듬 기반 치료·재창조 연주입니다. 가사분석은 가창활동의 기법입니다.',p:'p.189'},
{t:'mc',q:'악기를 신체 위치에 맞게 전략적으로 배치해 연주 동작 자체로 운동 범위·근력·손가락 협응을 훈련하는 NMT 기법은?',o:['RAS','PSE','TIMP','MIT'],a:2,e:'TIMP(치료적 악기연주)입니다. RAS는 보행, PSE는 뻗기·쥐기 같은 기능적 동작 시퀀스, MIT는 언어 산출에 쓰입니다.',p:'p.191'},
{t:'mc',q:'분석적 음악치료(AMT)를 1970년대에 개발한 사람은?',o:['줄리엣 알빈','메리 프리슬리','헬렌 보니','다이앤 오스틴'],a:1,e:'메리 프리슬리(1975)가 정신질환자 임상 경험을 바탕으로 개발했고, 프로이트 정신분석과 대상관계이론에 기반합니다.',p:'p.49, p.222'},
{t:'mc',q:'음악을 들으며 떠오르는 감정·기억·이미지를 언어화하거나 움직임으로 표현하게 하는 감상 방식은?',o:['수동적 음악 감상','능동적 음악 감상','음악기반 이완 활동','감상-창의활동 결합'],a:1,e:'능동적 음악 감상은 정서적 자기표현과 감정 탐색에 쓰입니다. 수동적 감상은 조용히 반응을 경험하며 긴장 완화에 효과적입니다.',p:'p.193'},
{t:'sa',q:'[주관식] 메리엄이 정리한 음악의 사회문화적 기능 아홉 가지를 쓰시오.',a:'감정 표현 / 심미적 즐거움 / 오락 기능 / 의사소통 / 상징적 표현 / 신체적 반응 유도 / 사회적 규범 강화 및 기관 통합 / 문화적 지속성 / 사회 통합',e:'국가(國歌)는 상징적 표현, 응원가·합창은 사회 통합의 예입니다. 통합의 도구가 배제의 도구도 될 수 있다는 점도 알아두세요.',p:'p.118'},
{t:'sa',q:'[주관식] 치료 조건 설계의 세 가지 측면과 예를 하나씩 쓰시오.',a:'환경 구성(방음 공간, 간접 조명) / 도구 및 음악 선택(소근육 조절이 어려우면 타악기) / 세션 구조화(예측 가능한 흐름과 단계적 구성, 반응에 따른 즉시 조정)',e:'세 측면은 상호의존적이어서 하나가 어긋나면 다른 요소로 온전히 보완되기 어렵습니다.',p:'p.152'},
{t:'sa',q:'[주관식] 인지행동 음악치료에서 음악이 하는 네 가지 치료적 역할과 활동 예를 쓰시오.',a:'감정조절(이완 음악 활동) / 인지 재구조화(노래 가사 수정) / 행동 변화 촉진(음악·이야기 속 문제해결 활동) / 대처기술 학습(감정인식 활동)',e:'이때 치료사는 구조화된 촉진자이자 코치로서 지시적이고 교육적인 역할을 합니다.',p:'p.44'},
{t:'sa',q:'[주관식] 음악이 정서를 유발하는 세 가지 이론(관련성·기대·최적 복잡성)을 각각 한 줄로 설명하시오.',a:'관련성 이론: 청자 개인의 기억·경험과 결부되어 정서 형성 / 기대 이론: 다음 음·화성에 대한 예측이 충족되면 안정, 어긋나면 긴장 / 최적 복잡성 이론: 너무 단순하지도 복잡하지도 않은 자극에서 쾌감이 최대(역U자)',e:'세 이론은 경쟁이 아니라 서로 다른 차원(개인적·음악 내적·각성 수준)을 설명하며, 임상에서는 동시에 작동합니다.',p:'p.106~107'},
{t:'sa',q:'[주관식] 수용적 음악 활동과 적극적 음악 활동의 차이를 방식과 예시로 비교하시오.',a:'수용적: 음악을 감상하며 참여(감상, 심상 유도) → 감정 이해·과거 성찰·정서 안정 / 적극적: 연주·노래·창작·즉흥연주로 직접 참여 → 감정의 자유로운 표현, 비언어적 관계 형성',e:'수용적 활동은 연주 기술이 필요 없어 신체적 제약이 크거나 언어 표현이 어려운 내담자에게 부담이 적습니다.',p:'p.9, p.28'},
{t:'sa',q:'[주관식] 감상활동의 네 가지 주요 유형을 쓰시오.',a:'수동적 음악 감상 / 능동적 음악 감상 / 음악기반 이완 활동 / 음악감상-창의활동 결합(그림 그리기·움직임)',e:'이완 활동은 호흡 조절·점진적 근육 이완법·명상을 병행하며 자율신경계 안정, 수면, 통증 관리에 쓰입니다.',p:'p.193'},
{t:'fb',q:'[빈칸] 거울신경은 ( ) 등이 1996년 원숭이의 전운동피질 F5 영역에서 처음 발견했다.',a:['리촐라티','Rizzolatti','rizzolatti'],e:'타인의 행동을 관찰만 해도 활성화되며, 합주·합창이 정서적 유대감을 높이는 신경과학적 근거가 됩니다.',p:'p.108'},
{t:'fb',q:'[빈칸] 1944년 ( )주립대학교에 세계 최초의 음악치료 학사 학위 과정이 개설되었다.',a:['미시간','Michigan','michigan'],e:'1946년에는 캔자스대학교에 최초의 석사 과정이 생겼습니다.',p:'p.38'},
{t:'fb',q:'[빈칸] 20세기 후반 ( )(1975)가 분석적 음악치료(AMT)를 발전시켰다.',a:['프리슬리','메리 프리슬리','Priestley','Mary Priestley'],e:'20세기 초 프로이트·융 → 중반 알빈·보니 → 후반 프리슬리 → 21세기 오스틴 순으로 정신역동 접근이 이어집니다.',p:'p.49'},
{t:'fb',q:'[빈칸] ( )활동은 언어적 표현과 비언어적 표현이 모두 가능한 융합적 기법으로, 노래부르기·가사분석·즉흥 보컬 연주·노래창작으로 구성된다.',a:['가창','가창활동'],e:'목소리를 사용해 정서 표현, 자기 인식, 사회성, 호흡·발성 훈련을 다룹니다.',p:'p.185'},
{t:'fb',q:'[빈칸] 치료적 음악활동의 도입 단계에서는 음악 감상이나 리듬 따라하기 같은 ( )적 활동으로 긴장을 완화한다.',a:['수용','수용적','수용적 활동'],e:'전개 단계는 즉흥연주·작곡 같은 능동적 활동, 마무리 단계는 감정 공유·이완·피드백입니다.',p:'p.157'},
{t:'mc',q:'타인의 표정·목소리를 무의식적으로 모방하고 그 신체 반응이 뇌로 피드백되어 유사한 감정을 느끼게 된다는 이론은?',o:['감정 전이 이론','카타르시스 이론','관련성 이론','기대 이론'],a:0,e:'감정 전이 이론(Hatfield, 1993)입니다. 음악의 상승·하강 선율을 따라 실제 감정도 변합니다.',p:'p.109'},
{t:'mc',q:'"신경심리정서 이론"의 8단계 정서 처리 과정을 제시한 학자는?',o:['메리엄','타우트','마이어','벌라인(Berlyne)'],a:1,e:'Thaut(2005)입니다. 음악 → 신경 처리 → 정서 → 행동 반응으로 이어지는 음악치료의 신경과학적 근거입니다.',p:'p.107~108'},
{t:'mc',q:'같은 음악도 사람마다 다르게 들리는 이유를 설명하는 지각의 성격은?',o:['수동적 수용','능동적 해석','물리량과의 1:1 비례','청각피질의 손상'],a:1,e:'기분·경험·나이·문화·상황에 따라 의미를 구성하는 능동적 해석 과정이기 때문입니다.',p:'p.81'},
{t:'mc',q:'촉각이나 음악 같은 비통증성 자극이 통증 신호보다 먼저 신경 경로를 차지해 통증 전달이 억제된다고 설명하는 이론은?',o:['관문통제이론','기대 이론','동질원리','대상관계이론'],a:0,e:'관문통제이론은 척수 수준의 통증 조절을 설명하지만, 엔도르핀·보상회로·주의 분산도 함께 작용합니다.',p:'p.79'},
{t:'mc',q:'소리의 물리적 특성 중 진폭은 무엇으로 지각되는가?',o:['음높이','음량','음색','시간'],a:1,e:'주파수는 음높이, 진폭은 음량으로 지각됩니다. 다만 물리량과 지각량이 정확히 비례하지는 않습니다(정신물리학).',p:'p.73'},
{t:'mc',q:'리듬처럼 예측 가능한 자극이 다음 자극의 시점을 뇌가 미리 준비하게 하는 기제는?',o:['예기적 주의','선택적 기억','감정 전이','역전이'],a:0,e:'예기적 주의는 도파민 분비와 연관되어 집중 유지에 도움이 되며, ADHD 아동에게도 활용됩니다.',p:'p.111'},
{t:'mc',q:'정신역동적 접근에서 치료사의 태도로 가장 알맞은 것은?',o:['비지시적 촉진자','무의식 탐색 동반자','지시적 전문가','지시적 중재자'],a:1,e:'치료사가 해석과 통찰을 제공하되 내담자의 무의식적 표현을 따라가므로 지시성 축의 중간에 놓입니다.',p:'p.49, p.53'},
{t:'mc',q:'20세기 초 음악치료가 전문 분야로 부각되는 결정적 계기가 된 것은?',o:['계몽주의','1·2차 세계대전 후 군인 재활과 자원봉사 음악가의 병원 연주','르네상스','한국음악치료학회 창립'],a:1,e:'전쟁 후 재활의 필요와 음악의 치료적 효과가 드러나며 학회·학위과정이 갖춰졌습니다.',p:'p.38'},
{t:'mc',q:'반복 수집한 정서·행동 지표의 변화를 살펴 치료사의 직관을 보완하는 분석 방법은?',o:['시계열 분석','사례개념화','기초선 설정','메타분석'],a:0,e:'시계열 분석(Time-series Analysis)은 세션마다 기록한 변화를 추적해 템포 조정, 악기 변경 같은 개입 수정의 근거가 됩니다.',p:'p.161'},
{t:'mc',q:'구조적 연주 중 치매 환자의 인지 자극에 적용되는 유형은?',o:['리듬 기반 연주','코드 기반 연주','패턴 기반 연주','신호 반응 연주'],a:2,e:'패턴 기반 연주는 반복 멜로디·리듬을 학습·재현합니다. 신호 반응 연주는 주의력, 코드 기반 연주는 우울감 완화에 쓰입니다.',p:'p.190'},
{t:'mc',q:'치료사가 내담자의 연주에 즉각 반응하며 상호작용 중심으로 진행하는 즉흥연주 유형은?',o:['구조적 즉흥','반응적 즉흥','주제 기반 즉흥','자유 즉흥'],a:1,e:'반응적 즉흥은 관계 형성이 필요한 아동, 사회성 결핍 청소년, 신뢰 형성 초기 세션에 적합합니다.',p:'p.190'},
{t:'mc',q:'그룹 내 연주 역할을 서로 교환하며 협력적 연주를 경험하는 재창조 연주 유형은?',o:['악보 기반 연주','즉흥적 변형 연주','파트 교환 연주','리듬 재창조 연주'],a:2,e:'파트 교환 연주는 자폐 아동 그룹의 사회성 증진, 발달장애 아동의 협동 능력 향상에 쓰입니다.',p:'p.192'},
{t:'sa',q:'[주관식] 체계적 치료과정의 네 단계를 쓰고, 순환 구조라는 점을 설명하시오.',a:'진단평가 → 치료계획 수립 → 치료 적용 → 평가 및 수정. 한 번으로 끝나지 않고 평가 결과가 다시 진단평가로 환류되는 반복적 순환(Reflexive Process) 구조다.',e:'진단평가는 초기 한 번이 아니라 치료 기간 내내 열려 있는 절차입니다.',p:'p.11~13'},
{t:'sa',q:'[주관식] 정서적 영역의 세부 치료 목표 다섯 가지를 쓰시오.',a:'감정 인식 / 감정 표현 / 정서 조절 / 자존감 및 자기효능감 / 스트레스·불안 완화',e:'예: 즉흥연주로 말하기 어려운 감정을 소리로 표출(감정 표현), 이완 음악으로 불안 수준 낮추기(정서 조절).',p:'p.154~155'},
{t:'sa',q:'[주관식] 인본주의 음악치료에서 음악의 네 가지 치료적 역할을 쓰시오.',a:'자기 탐색 촉진 / 창의적 자기표현 / 자아실현 촉진 / 개인적 의미 발견',e:'즉흥연주, 작곡, 음악 감상, 가사 분석이 활용되며 치료사는 무조건적 긍정적 존중·공감적 이해·진솔함으로 대합니다.',p:'p.46'},
{t:'sa',q:'[주관식] 음악이 영향을 미치는 인지 영역 네 가지를 쓰시오.',a:'기억력·주의력 / 문제해결·창의성 / 언어 능력 / 학습',e:'음악은 청각·운동·정서·기억·언어 신경망을 동시에 가동시키는 "다중 표적" 자극이며 신경가소성을 촉진합니다.',p:'p.110, p.114'},
{t:'sa',q:'[주관식] 창조적 음악치료(NRMT)의 다섯 가지 적용 단계를 쓰시오.',a:'① 초기 평가 ② 관계 형성 ③ 표현 발달 ④ 정서적 전환 ⑤ 종결 및 지속 변화',e:'NRMT는 음악 중심성 철학이 뚜렷해 별도의 언어적 해석을 필수로 요구하지 않습니다.',p:'p.219, p.223'},
{t:'sa',q:'[주관식] 소리가 음악으로 조직화되는 과정을 쓰시오.',a:'물리적 변인(음파: 진동) → 감각적 변인(외이·중이·내이·청신경·청각피질을 거치며 전기 신호로 변환) → 지각적 변인(뇌의 해석으로 음악으로 조직화). 물리 → 기계 → 전기 → 인식의 변환이다.',e:'주기적 소리는 음악의 구조적 기반이 되고, 비주기적 소리는 소음으로 인식되어 불쾌함을 줄 수 있습니다.',p:'p.74~75, p.82'},
{t:'sa',q:'[주관식] 초기 음악치료와 현대 음악치료를 초점·대상·접근 방식으로 비교하시오.',a:'초기: 질병 치료·건강 회복 / 환자 중심 / 증상 완화 중심 치료적·교정적 개입. 현대: 질병 예방·웰빙·삶의 질 향상 / 일반인 포함 전 생애주기 / 심리·정서·사회·영적 차원의 통합적 접근',e:'WHO(1948)의 건강 정의와 궤를 같이하며, 뇌과학·VR·AI와 결합해 근거기반 실천으로 성숙하고 있습니다.',p:'p.4~5, p.26'},
{t:'sa',q:'[주관식] AI·VR이 음악치료에 도입되어도 달라지지 않는 것은 무엇인지 설명하시오.',a:'AI·VR은 어떤 자극을 어떻게 제공할지의 "방법" 층위의 도구일 뿐, 진단·체계적 계획·치료적 관계라는 음악치료의 핵심은 여전히 치료사의 몫이다. 기술이 치료사를 대체하기보다 치료사 중심의 하이브리드 구조가 중요해진다.',e:'최근에는 감상 → 연상 → 창작 → 표현 → 공유로 이어지는 혼합형 모델도 시도됩니다.',p:'p.194~196'},
{t:'fb',q:'[빈칸] ( )는 자신과 타인의 감정을 이해하고 조절하는 정신화(Mentalization) 능력이 PTSD·경계성 성격장애에 효과적임을 제시했다.',a:['포나기','Fonagy','fonagy'],e:'정신역동 접근의 최근 이론가이며, 이 외에 클라인(대상관계이론), 코헛(자기심리학)이 있습니다.',p:'p.47'},
{t:'fb',q:'[빈칸] 융의 분석심리학은 집단 ( )과 원형의 개념으로 음악의 상징적 역할을 강조했다.',a:['무의식'],e:'"집단 무의식"이 정답입니다. 음악 속 상징과 원형적 이미지가 집단 무의식에 닿아 깊은 치유를 이끈다고 보았습니다.',p:'p.47~48'},
{t:'fb',q:'[빈칸] 20세기 중반 줄리엣 알빈은 ( ) 즉흥연주를 제안해 억압된 감정과 무의식적 갈등 탐구를 도왔다.',a:['자유','자유즉흥','자유 즉흥','자유즉흥연주','자유 즉흥연주'],e:'알빈과 함께 헬렌 보니의 GIM이 20세기 중반의 두 실천적 흐름입니다.',p:'p.48~49'},
{t:'fb',q:'[빈칸] 18세기 중반 브로클레스비는 음악이 ( )를 자극하여 건강에 유익한 효과를 줄 수 있다고 보았다.',a:['신경계','신경'],e:'계몽주의 시대의 실증적·생리학적 접근이며 정신병원에서 음악을 활용하는 초기 이론적 근거가 되었습니다.',p:'p.37'},
{t:'fb',q:'[빈칸] 옥시토신은 "사랑·( ) 호르몬"으로 불리며 포옹·스킨십·음악 감상 시 분비되어 신뢰감과 공감 능력을 높인다.',a:['유대감','유대'],e:'세로토닌은 행복 호르몬, 엔도르핀은 천연 진통제로 불립니다.',p:'p.50'},
{t:'fb',q:'[빈칸] 엔도르핀은 통증을 억제하고 쾌감을 주는 천연 ( )로 불린다.',a:['진통제'],e:'모르핀과 유사한 내인성 구조를 가지며, 음악의 통증 완화 효과에도 관여합니다.',p:'p.50'},
{t:'fb',q:'[빈칸] "음악활동 중 ( )분간 집중력을 유지한다"는 구체적이고 측정 가능한 치료 목표의 예로 제시되었다. (숫자로 입력)',a:['5','5분'],e:'"기분이 좋아지도록 돕는다" 같은 막연한 표현 대신 측정 가능한 형태로 설정해야 효과를 판단할 수 있습니다.',p:'p.12, p.152'},
{t:'fb',q:'[빈칸] NRMT는 1974년 영국에 센터가 설립되었고, 1989년 미국 ( ) 대학교(NYU)에도 전문 센터가 설립되었다.',a:['뉴욕','뉴욕대','뉴욕대학교','NYU','nyu'],e:'초기에는 Sunmount State School, Goldie Williams School 등에서 임상을 진행했습니다.',p:'p.218'},
{t:'fb',q:'[빈칸] NMT의 철학적 특성 중 뇌의 재조직 가능성에 기반해 반복적 자극을 제공한다는 개념은 ( )이다.',a:['신경가소성'],e:'NMT의 네 가지 철학: 기능 회복 중심, 음악의 생리학적 자극 특성 활용, 신경가소성, 참여 기반 전인적 재활.',p:'p.225'},
{t:'fb',q:'[빈칸] NMT는 1990년대 초 ( )주립대학교에서 마이클 타우트에 의해 개발되었다.',a:['콜로라도','Colorado','colorado'],e:'이후 1999년 NMT 학회가 창설되고 2000년부터 인증 프로그램이 운영되었습니다.',p:'p.225'},
{t:'mc',q:'CBT의 세 가지 전략 중 내담자의 역기능적 사고를 보다 적응적인 사고로 수정하는 데 중점을 두는 것은?',o:['인지 재구조화','대처 기술 치료','문제 해결 치료','체계적 둔감화'],a:0,e:'CBT의 세 전략은 인지 재구조화, 대처 기술 치료(스트레스 대처 기술 훈련), 문제 해결 치료입니다.',p:'p.43'},
{t:'mc',q:'아리스토텔레스가 음악이 영혼의 정화와 감정의 해소를 가능케 한다며 제시한 개념은?',o:['카타르시스','동질원리','자아실현','예기적 주의'],a:0,e:'고대 그리스 철학자들은 음악을 윤리적·치유적 힘으로 이해했습니다.',p:'p.36'},
{t:'mc',q:'고대·중세에 음악이 몸과 마음에 좋은 영향을 준다는 기록은 오늘날의 개념으로 무엇에 가까운가?',o:['경험적 치유(healing)','전문적 치료(therapy)','진단평가','근거기반 실천'],a:0,e:'치유의 기록이지 전문적 치료는 아닙니다. 이 역사는 음악치료가 전문 분야로 성립한 "토대"로 읽어야 합니다.',p:'p.36'},
{t:'mc',q:'불협화음이 음악에서 하는 역할로 알맞은 것은?',o:['항상 불쾌감만 준다','협화음으로 해결될 때 감정적 해소의 강도를 높인다','협화음과 구별되지 않는다','리듬의 속도만 바꾼다'],a:1,e:'긴장을 증폭시키지만 이후 협화음으로 해결될 때 해소를 더 크게 느끼게 합니다. 기대 이론의 긴장-해소 원리의 예입니다.',p:'p.105'},
{t:'mc',q:'정서 조건형성(Evaluative Conditioning)은 치료사에게 어떤 점이 중요하다고 시사하는가?',o:['악기 가격 비교','내담자의 선호 음악을 사전에 파악하는 것','치료 기간 단축','세션 횟수 증가'],a:1,e:'음악이 반복적으로 특정 상황과 함께 경험되면 정서가 학습되므로, 정서는 음향 속성뿐 아니라 청자가 부여한 의미에 좌우됩니다.',p:'p.106'},
{t:'mc',q:'리듬·억양의 공유 신경 경로를 근거로 음운 인식 향상에 활용되는 대상은?',o:['난독증 아동','파킨슨병 환자','치매 환자','우울 청소년'],a:0,e:'음악과 언어는 리듬·억양·구조적 패턴을 공유합니다. 성인은 작업 기억 강화로 외국어 습득을 돕습니다.',p:'p.112~114'},
{t:'mc',q:'대근육 재활이 목표인 뇌졸중 환자에게 적합한 악기는?',o:['큰 북, 심벌즈 등 타악기','칼림바','피아노','핸드벨 한 음판'],a:0,e:'팔·몸통을 크게 움직이게 하는 타악기가 적합하고, 정교한 손가락 재훈련에는 피아노·칼림바가 적합합니다.',p:'p.159'},
{t:'mc',q:'성악심리치료(VPT)에서 치료사가 안정적인 반복음이나 화음으로 감정을 지지하는 기법은?',o:['보컬 홀딩','진짜 목소리','자유연상 가창','즉흥 보컬 표현'],a:0,e:'보컬 홀딩으로 안전한 표현 공간을 마련합니다. 진짜 목소리는 억압되지 않은 자기 표현의 상징입니다.',p:'p.228'},
{t:'sa',q:'[주관식] 성악심리치료(VPT)의 적용 네 단계를 쓰시오.',a:'정서 확인 및 치료 관계 형성 → 보컬 즉흥 구조 설정 → 보컬 상호작용 및 감정 탐색 → 언어적 통합 및 해석',e:'즉흥 발성을 통해 억눌린 감정을 표출하고, 마지막에 감정과 상징을 언어화해 자기 인식과 정서 통합을 촉진합니다.',p:'p.229'},
{t:'sa',q:'[주관식] 분석적 음악치료(AMT)의 적용 네 단계를 쓰시오.',a:'감정 및 이슈 확인 → 즉흥연주 구조 설정 → 즉흥연주 및 상호작용 → 언어화 및 해석',e:'구조 설정 단계에서 악기 선택과 역할 분담(동시·교대 연주)으로 내담자가 통제감을 느끼게 합니다.',p:'p.223'},
{t:'sa',q:'[주관식] 치료 종료 시점에 음악치료사가 수행해야 할 역할을 쓰시오.',a:'목표·경과·반응·평가 결과를 정리한 치료 요약 보고서 작성, 타 전문가와의 협력 회의 참여로 정보 공유와 향후 개입 논의, 보호자에게 가정 적용 음악활동 안내, 학교·복지기관·병원과 치료 내용 공유',e:'언어치료·심리상담·작업치료·물리치료 등과의 다학제적 연계로 후속 치료의 연속성을 확보합니다.',p:'p.162'},
{t:'sa',q:'[주관식] 집단 음악활동에서 사회성을 평가할 때의 관찰 지표와 중재 방식을 쓰시오.',a:'지표: 눈맞춤 빈도, 리더십·의견 제시 등 상호작용의 질, 정확성·적극성 등 과제 수행 기여도. 중재: 리더십 있는 내담자에게 고난도 역할 부여, 소극적인 내담자에게 작은 성공 경험 설계. 목표: 사회적 기술 및 자발성 향상',e:'진단평가의 실제 적용 사례 세 가지(주의력 결핍 리듬 과제, 집단 사회성, 정서·신체 반응) 중 하나입니다.',p:'p.149'},
{t:'sa',q:'[주관식] 음악이 분비를 증가시키는 호르몬·신경전달물질과 감소시키는 호르몬을 쓰시오.',a:'증가: 세로토닌(행복 호르몬), 옥시토신(사랑·유대감), 엔도르핀(천연 진통제). 감소: 스트레스 호르몬인 코르티솔',e:'이를 통해 긍정적 정서를 유도하고 스트레스를 줄여 우울증·불안 장애 개입에 활용됩니다.',p:'p.50, p.77'},
{t:'sa',q:'[주관식] 다섯 접근법을 비교하는 두 개의 좌표 축을 설명하시오.',a:'① 치료사 태도 축: 지시적 ↔ 비지시적 ② 개입 대상 축: 심리적 ↔ 생리적. 생의학적 접근은 자율신경계·호르몬 등 신체 전반, 신경학적 접근은 뇌와 신경계 기능 회복에 더 좁고 깊게 집중',e:'우열을 가리기 위한 틀이 아니라 내담자 특성과 목표에 맞는 접근을 가늠하는 참고 틀입니다.',p:'p.53~54'},
{t:'fb',q:'[빈칸] 벡(1976)의 인지치료와 엘리스(1962)의 ( )는 개인의 사고 패턴을 다루는 CBT의 토대가 되었다.',a:['REBT','rebt'],e:'합리적 정서행동치료(REBT)입니다. 행동주의와 인지심리학을 통합한 것이 인지행동치료입니다.',p:'p.43'},
{t:'fb',q:'[빈칸] 클라인의 ( )이론은 어린 시절 부모와의 관계가 대상 표상으로 새겨져 성인기 대인관계에 투사적 동일시로 재현된다고 보았다.',a:['대상관계','대상관계이론'],e:'VPT와 AMT의 이론적 배경이기도 합니다.',p:'p.47'},
{t:'fb',q:'[빈칸] 코헛의 ( )심리학은 어린 시절 부모의 초기 공감 경험이 건강한 자기구조 형성에 결정적이라고 보았다.',a:['자기','자기심리학'],e:'공감이 결여되면 심리적 불안정으로 이어질 수 있다고 봅니다.',p:'p.47'},
{t:'fb',q:'[빈칸] 집단으로 노래를 부르는 것이 단순히 음악을 ( ) 것보다 기분과 정서적 웰빙 향상에 더 효과적이라는 근거가 보고되었다. (Clark & Harding, 2012)',a:['듣는','듣는 것','듣는것','듣기'],e:'체계적 문헌고찰에서 능동적 노래 부르기의 심리사회적 효과가 확인되었습니다.',p:'p.186'},
{t:'fb',q:'[빈칸] 한국의 음악치료사는 학위 과정 내 임상 실습과 전문가 ( )이 필수이다.',a:['수퍼비전','슈퍼비전','supervision','Supervision'],e:'음악적·임상적 역량을 동시에 갖춘 점에서 일반 음악가·음악 교사와 구별됩니다.',p:'p.29'},
{t:'fb',q:'[빈칸] 웩슬러 아동지능검사(WISC) 같은 표준화된 심리검사는 음악치료사가 직접 하기보다 ( ) 등이 실시한 결과를 참고하는 것이 일반적이다.',a:['임상심리사'],e:'지능검사의 인지적 강약점 프로파일은 음악 과제의 난이도와 초점 영역을 설계하는 참고가 됩니다.',p:'p.148'}
];
const done={};let flt='all';
const L={mc:'객관식',sa:'주관식',fb:'빈칸'};
function norm(s){return s.replace(/\s/g,'').toLowerCase()}
function bar(){let c=0,n=0;for(const k in done){if(!/^\d+$/.test(k))continue;n++;if(done[k])c++}
 const b=document.getElementById('bar');
 b.innerHTML=[['all','전체'],['mc','객관식'],['sa','주관식'],['fb','빈칸']].map(x=>`<button class="${flt==x[0]?'on':''}" onclick="flt='${x[0]}';draw()">${x[1]}</button>`).join('')+`<button onclick="done={};draw()">초기화</button><span class="sc">정답 ${c} / 풀이 ${n} / 전체 ${Q.length}</span>`}
function ansBox(i,ok){const q=Q[i];return `<div class="ans show"><div>${ok===null?'':`<span class="r ${ok?'ok':'no'}">${ok?'정답!':'오답'}</span> `}<b>정답:</b> ${q.t=='mc'?q.o[q.a]:q.t=='fb'?q.a[0]:q.a}</div><div style="margin-top:6px">${q.e}</div><div style="margin-top:6px">📖 강의안 <span class="pg">${chap(q.p)} · ${q.p}</span></div></div>`}
function chap(p){const n=parseInt(p.match(/\d+/)[0]);const r=[[33,'1장 음악치료의 정의와 정체성'],[58,'2장 음악치료의 역사 및 철학'],[83,'3장 음악과 인간(1) 신체생리적 기능'],[121,'4장 음악과 인간(2)'],[165,'5장 음악치료 과정'],[198,'6장 음악치료방법(1)'],[231,'7장 음악치료방법(2)']];return r.find(x=>n<=x[0])[1]}
function draw(){bar();const el=document.getElementById('list');el.innerHTML='';
 Q.forEach((q,i)=>{if(flt!='all'&&q.t!=flt)return;
  const d=document.createElement('div');d.className='card';
  let h=`<div class="tag">Q${i+1} · ${L[q.t]}</div><div class="q">${q.q.replace(/^\[(주관식|빈칸)\]\s*/,'')}</div>`;
  const s=done[i];
  if(q.t=='mc')h+=q.o.map((o,j)=>`<button class="opt ${s!==undefined?(j==q.a?'ok':(j==done['s'+i]?'no':'')):''}" ${s!==undefined?'disabled':''} onclick="pick(${i},${j})">${j+1}) ${o}</button>`).join('');
  if(q.t=='fb')h+=`<input type="text" id="in${i}" placeholder="정답 입력" value="${done['v'+i]||''}" ${s!==undefined?'disabled':''}> ${s!==undefined?'':`<button style="margin-top:8px" onclick="chk(${i})">확인</button>`}`;
  if(q.t=='sa')h+=`<textarea rows="3" placeholder="내 답안을 적어 보세요" id="in${i}">${done['v'+i]||''}</textarea>${s!==undefined?'':`<button style="margin-top:8px" onclick="show(${i})">정답 보기</button>`}`;
  if(s!==undefined||done['r'+i]){h+=ansBox(i,q.t=='sa'?null:s);
   if(q.t=='sa'&&s===undefined)h+=`<div style="margin-top:8px"><button onclick="self(${i},true)">맞혔어요</button> <button onclick="self(${i},false)">틀렸어요</button></div>`}
  d.innerHTML=h;el.appendChild(d)})}
function pick(i,j){done['s'+i]=j;done[i]=(j==Q[i].a);draw()}
function chk(i){const v=document.getElementById('in'+i).value;done['v'+i]=v;done[i]=Q[i].a.some(a=>norm(a)==norm(v));draw()}
function show(i){done['v'+i]=document.getElementById('in'+i).value;done['r'+i]=1;draw()}
function self(i,ok){done[i]=ok;draw()}
draw();
</script></main></body></html>
