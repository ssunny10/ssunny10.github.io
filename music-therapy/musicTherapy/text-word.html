        detailHTML: `
          <div class="sub-card">
            <span class="sub-title">📌 1. 정의 및 학문적 개요 (교재 7장 3절 & 핸드아웃 7주차 8~10쪽)</span>
            • 내담자의 무의식적 감정과 심리적 갈등을 소리 표현(음악)을 통해 탐색하고 통찰하는 <strong>정신역동적 음악치료 접근법</strong>입니다.<br>
            • 프로이트와 융의 정신분석 이론을 적용하여, 특히 즉흥 음악(음성·악기·신체 움직임)을 통해 억압된 감정과 과거 경험을 상징적으로 표현하고 분석합니다.<br>
            • 언어로는 직접 다루기 힘든 깊은 무의식적 저항과 방어를 우회하여 상징적으로 접근할 수 있도록 돕습니다.
          </div>
          <div class="sub-card">
            <span class="sub-title">🏛️ 2. 역사 및 철학적 배경</span>
            • <strong>창시자:</strong> 1970년대 영국의 음악치료사 메리 프리슬리(Mary Priestley, 1975)가 정신질환자 임상 경험을 바탕으로 개발.<br>
            • <strong>발전:</strong> 마조리 와들, 피터 라잇과 함께 정신보건기관에서 실험적 세션을 운영하며 독립적 치료 모델로 체계화.<br>
            • <strong>철학:</strong> 지그문트 프로이트의 정신분석 및 멜라니 클라인 등의 <strong>대상관계이론(Object Relations Theory)</strong>에 기반.<br>
            • <strong>음악관:</strong> 음악을 자아(Ego)와 무의식 간 소통을 가능하게 하는 <strong>'정신의 언어(상징적 언어)'</strong>로 규정. 치료사는 즉흥연주 속에서 역전이를 인식하고 통찰을 촉진.

            • <strong>② 소리 표현 (Sound Expression):</strong> 목소리, 악기, 움직임으로 언어화하기 어려운 감정과 무의식을 상징적으로 표출하는 원초적 소통 수단.<br>
            • <strong>③ 상징적 해석 (Symbolic Interpretation):</strong> 즉흥연주 중 나타나는 <em>반복 리듬, 불협화음, 강박적 패턴, 침묵, 주저함</em> 등을 내담자의 심리 상태나 억압된 기억의 상징으로 해석 (꿈 분석과 유사).<br>
            • <strong>④ 음악적 역전이 (Musical Countertransference):</strong> 치료사가 내담자의 음악에 반응하며 경험하는 정서적 감정이나 신체적 느낌을 인식하여, 내담자의 무의식을 이해하는 <strong>치료적 통찰의 핵심 도구</strong>로 활용.<br>
            • <strong>⑤ 언어적 통합 (Verbal Integration):</strong> 연주 경험 후 반드시 감정과 상징, 경험을 언어로 정리하여 자기 이해와 자아 통합을 촉진.

            • <strong>구조:</strong> 통상 모듈 단위(예: 60분 2회기 등)로 집중적인 심층 탐색을 진행.
          </div>
          <div class="sub-card">
            <span class="sub-title">🎯 5. AMT 적용 4단계 과정</span>
            ① <strong>감정 및 이슈 확인:</strong> 현재 정서 상태와 중심 주제 탐색, 작업 목적 및 치료적 초점 설정.<br>
            ② <strong>즉흥연주 구조 설정:</strong> 악기 선택, 치료사와의 역할 분담(동시 연주, 교대 연주 등) 계획을 통한 통제감 부여.<br>
            ③ <strong>즉흥연주 및 상호작용:</strong> 음악을 통한 감정·무의식 표출, 치료사의 음악적 반응 및 정서적 공명 형성.<br>
            ④ <strong>언어화 및 해석:</strong> 연주 경험을 언어로 풀고 무의식적 갈등을 의식화하여 통합 (필요시 그림, 시 쓰기 병행).
          </div>

            <span class="sub-title">💡 6. 전공심화: 타 심화기법과의 비교</span>
            • <strong>NRMT vs AMT:</strong> NRMT는 음악 중심성으로 음악적 관계 자체에서 치유가 완결되나, AMT는 연주 후 <strong>반드시 '언어화 및 해석'을 거쳐 통찰로 연결</strong>함.<br>

          </div>

    function searchKnowledgeBase(query) {
      if (!query || query.trim() === "") return [];

      var cleanQuery = query.toLowerCase();
      var cleanNorm = normalize(cleanQuery);
      var tokens = cleanQuery.split(/[\s,?!.\n]+/).filter(function(t) { return t.length > 0; });

      var scoredList = MUSIC_THERAPY_DB.map(function(item) {
        var score = 0;
        var normName = normalize(item.name);
        var normPoint = normalize(item.corePoint);

        // 1. 1차 고유 키워드 매칭 (+45점)
        item.primaryKeys.forEach(function(pk) {
          var normPk = normalize(pk);
          if (cleanNorm.indexOf(normPk) !== -1) {
            score += 45;
          } else {
            tokens.forEach(function(tok) {
              var normTok = normalize(tok);
              if (normTok.length >= 2 && normPk.indexOf(normTok) !== -1) {
                score += 15;
              }
            });
          }
        });

        // 2. 2차 보조 키워드 매칭 (+10점)
        item.secondaryKeys.forEach(function(sk) {
          var normSk = normalize(sk);
          if (cleanNorm.indexOf(normSk) !== -1) {
            score += 10;
          } else {
            tokens.forEach(function(tok) {
              var normTok = normalize(tok);
              if (normTok.length >= 2 && normSk.indexOf(normTok) !== -1) {
                score += 5;
              }
            });
          }
        });

        // 3. 이름 및 핵심 요약 텍스트 매칭
        tokens.forEach(function(tok) {
          var normTok = normalize(tok);
          if (normTok.length >= 2) {
            if (normName.indexOf(normTok) !== -1) score += 20;
            if (normPoint.indexOf(normTok) !== -1) score += 10;
          }
        });

        return {
          ch: item.ch,
          name: item.name,
          corePoint: item.corePoint,
          detailHTML: item.detailHTML,
          syn: item.syn,
          score: score
        };
      });

      return scoredList.filter(function(item) { return item.score > 0; }).sort(function(a, b) {
        return b.score - a.score;
      });
    }

    function inferTheory() {
      var query = document.getElementById("input-desc").value.trim();
      var box = document.getElementById("result-box");

      if (!query) {
        alert("분석할 지문이나 키워드를 입력해 주세요!");
        return;
      }

      var results = searchKnowledgeBase(query);
      box.style.display = "block";

      if (results.length > 0 && results[0].score >= 12) {
        var top = results[0];
        document.getElementById("res-chapter").innerText = "📌 " + top.ch + " (일치도: " + top.score + "점)";
        document.getElementById("res-diag").innerText = top.name;
        document.getElementById("res-point").innerHTML = "<strong>⏱ 핵심 판별 요약:</strong><br>" + top.corePoint;
        document.getElementById("res-detail").innerHTML = "<strong>💡 강의안 및 교재 상세 내용:</strong>" + top.detailHTML;
        document.getElementById("res-synonyms").innerText = "* 시험 주관식 답안 인정 표기: " + top.syn;
      } else {
        document.getElementById("res-chapter").innerText = "⚠️ 판별 불가";
        document.getElementById("res-diag").innerText = "일치하는 음악치료 교안 단서 부족";
        document.getElementById("res-point").innerText = "강의안 슬라이드의 핵심 문장, 기법 이름, 또는 임상 활동 예시를 한 문장 이상 복사해 넣어보세요.";
        document.getElementById("res-detail").innerText = "";
        document.getElementById("res-synonyms").innerText = "";
      }
    }

    function setQuick(text) {
      document.getElementById("input-desc").value = text;
      inferTheory();
    }

    function clearText() {
      document.getElementById("input-desc").value = "";
      document.getElementById("result-box").style.display = "none";
      document.getElementById("input-desc").focus();
    }

    // Ctrl + Enter 단축키 지원
    document.getElementById("input-desc").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        inferTheory();
      }
    });
  </script>
