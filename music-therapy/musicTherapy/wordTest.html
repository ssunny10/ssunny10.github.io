    function inferDiagnosis() {
      var raw = document.getElementById("input-desc").value.trim();
      if (!raw) { alert("지문을 입력해 주세요!"); return; }

      var clean = normalize(raw);
      var rawTokens = raw.toLowerCase().split(/[\s,?!.\n]+/).map(t => normalize(t)).filter(t => t.length >= 2);

      var best = null;
      var highestScore = -1;

      MASTER_DB.forEach(function(item) {
        var score = 0;
        var normTitle = normalize(item.title || item.name);

        // 1. 전체 검색어가 제목이나 대표키워드에 직접 포함될 때 대폭 가점
        if (normTitle.indexOf(clean) !== -1 && clean.length >= 2) score += 60;

        item.primaryKeys.forEach(function(pk) {
          var normPk = normalize(pk);
          if (clean.indexOf(normPk) !== -1 || normPk.indexOf(clean) !== -1) {
            score += 50;
          }
        });

        // 2. 단어 토큰 교차 분석
        rawTokens.forEach(function(tok) {
          if (normTitle.indexOf(tok) !== -1) score += 20;
          item.primaryKeys.forEach(function(pk) {
            if (normalize(pk).indexOf(tok) !== -1) score += 15;
          });
          item.secondaryKeys.forEach(function(sk) {
            if (normalize(sk).indexOf(tok) !== -1) score += 10;
          });
        });

        // 3. 5대 심화기법 총괄 예외 보정
        if (item.isSpecial5Cards) {
          if (clean.indexOf("다섯가지심화기법") !== -1 || clean.indexOf("5가지심화기법") !== -1 || clean.indexOf("심화기법") !== -1) {
            if (clean.indexOf("nrmt") === -1 && clean.indexOf("bmgim") === -1 && clean.indexOf("amt") === -1 && clean.indexOf("nmt") === -1 && clean.indexOf("vpt") === -1) {
              score += 90;
            }
          }
        }

        if (score > highestScore) {
          highestScore = score;
          best = item;
        }
      });

      var box = document.getElementById("result-box");
      box.style.display = "block";

      if (highestScore >= 10 && best) {
        document.getElementById("res-chapter").innerText = "📌 " + best.ch + " (일치도: " + highestScore + "점)";
        document.getElementById("res-diag").innerText = best.name;

        var contentHtml = "";

        if (best.isSpecial5Cards) {
          contentHtml += `
            <div class="grid-5-cards">
              <div class="sub-card-box"><div class="sub-card-eng">NRMT</div><div class="sub-card-kor">창조적 음악치료</div><div class="sub-card-desc">즉흥연주를 통한 인간중심적 창조성 활성화[cite: 114, 312]</div></div>

              <div class="sub-card-box"><div class="sub-card-eng">AMT</div><div class="sub-card-kor">분석적 음악치료</div><div class="sub-card-desc">즉흥 음악의 상징적 해석을 통한 정신역동적 통찰[cite: 114, 312]</div></div>
              <div class="sub-card-box"><div class="sub-card-eng">NMT</div><div class="sub-card-kor">신경학적 음악치료</div><div class="sub-card-desc">신경과학 기반 운동·언어·인지 기능 재활[cite: 114, 312]</div></div>
              <div class="sub-card-box"><div class="sub-card-eng">VPT</div><div class="sub-card-kor">성악심리치료</div><div class="sub-card-desc">즉흥 발성을 통한 정서·신체 경험의 통합[cite: 114, 312]</div></div>
            </div>
          `;
        }

        contentHtml += best.detailHTML;
        document.getElementById("res-content").innerHTML = contentHtml;
        document.getElementById("res-synonyms").innerText = "* 시험 주관식 답안 인정 표기: " + best.syn;
      } else {
        document.getElementById("res-chapter").innerText = "⚠️ 판별 불가";

      }
    }
